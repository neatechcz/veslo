[scenario]
name = "sidebar-primary-actions-overflow"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "sidebar primary actions render without hiding app navigation"
action = "eval"
timeout_ms = 45000
script = '''
window.localStorage.setItem("veslo.onboardingComplete", "1");
window.localStorage.setItem("veslo.language", "en");
const route = "/session";
const oldUrl = window.location.href;
window.location.hash = route;
window.dispatchEvent(new HashChangeEvent("hashchange", { oldURL: oldUrl, newURL: window.location.href }));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let text = "";
const deadline = Date.now() + 45000;
while (Date.now() < deadline) {
  text = document.body.innerText.replace(/\s+/g, " ").trim();
  if (text.length > 60) break;
  await sleep(250);
}
if (!text) throw new Error("Sidebar/session shell did not render visible text.");
true;
'''
