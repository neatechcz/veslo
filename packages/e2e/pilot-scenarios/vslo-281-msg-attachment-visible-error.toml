[scenario]
name = "vslo-281-msg-attachment-visible-error"
fail_fast = true
global_timeout_ms = 240000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "VSLO-281 unsupported MSG is visible and does not poison the chat"
action = "eval"
timeout_ms = 210000
script = '''
const pilotE2E = window.__vesloPilotE2E;
if (!pilotE2E) throw new Error('Pilot browser prelude is unavailable.');
const { normalize, assert, invoke, visible, insertContenteditableThroughBrowser } = pilotE2E;
const waitUntil = (predicate, options = {}) => pilotE2E.waitUntil(predicate, {
  timeout: options.timeout ?? 45000,
  interval: options.interval ?? 150,
  message: options.message ?? 'condition was not met',
});
const completeSelector = '[data-testid="vslo-281-msg-complete"]';
const errorSelector = '[data-testid="vslo-281-msg-error"]';
document.querySelector(completeSelector)?.remove();
document.querySelector(errorSelector)?.remove();
const appendFailure = (error) => {
  if (document.querySelector(errorSelector) || document.querySelector(completeSelector)) return;
  const marker = document.createElement('pre');
  marker.dataset.testid = 'vslo-281-msg-error';
  marker.textContent = String(error?.message ?? error).slice(0, 5000);
  document.body.append(marker);
};
const serverRequest = async (baseUrl, token, path, options = {}) => {
  const response = await fetch(`${baseUrl}${path}`, {
    ...options,
    headers: {
      authorization: `Bearer ${token}`,
      accept: 'application/json',
      ...(options.body ? { 'content-type': 'application/json' } : {}),
      ...(options.headers || {}),
    },
  });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = null; }
  return { ok: response.ok, status: response.status, body };
};

if (!window.__vslo281MsgStarted) {
window.__vslo281MsgStarted = true;
window.__vslo281MsgPromise = (async () => {
try {

window.localStorage.setItem('veslo.onboardingComplete', '1');
window.localStorage.setItem('veslo.language', 'en');
window.localStorage.setItem('veslo.sendWorkflowTrace', '1');

const bootstrap = await invoke('workspace_bootstrap');
const workspace = bootstrap?.workspaces?.find((item) => item.id === bootstrap?.activeId) ?? bootstrap?.workspaces?.[0];
const workspacePath = normalize(workspace?.path || workspace?.directory);
assert(workspacePath, 'The isolated VSLO-281 workspace is unavailable.');

const localServer = await waitUntil(async () => {
  const info = await invoke('veslo_server_info').catch(() => null);
  const baseUrl = normalize(info?.baseUrl).replace(/\/+$/, '');
  const token = normalize(info?.clientToken);
  if (!info?.running || !baseUrl || !token) return false;
  const health = await fetch(`${baseUrl}/health`).catch(() => null);
  return health?.ok ? { baseUrl, token } : false;
}, { timeout: 90000, interval: 500, message: 'The local Veslo server did not become ready.' });

const workspaces = await serverRequest(localServer.baseUrl, localServer.token, '/workspaces');
assert(workspaces.ok && Array.isArray(workspaces.body?.items), 'The local server did not expose workspaces.');
const serverWorkspace = workspaces.body.items.find((item) => normalize(item.path) === workspacePath) ?? workspaces.body.items[0];
const workspaceId = normalize(serverWorkspace?.id);
const fixtureBaseUrl = normalize(serverWorkspace?.baseUrl).replace(/\/+$/, '');
assert(workspaceId && fixtureBaseUrl.startsWith('http://127.0.0.1:'), 'The deterministic lifecycle fixture is not bound to the VSLO-281 workspace.');

const fixtureState = async () => {
  const response = await fetch(`${fixtureBaseUrl}/__session_queue_fixture/state`);
  assert(response.ok, `The lifecycle fixture state read failed (${response.status}).`);
  return await response.json();
};
const fixturePost = async (path, body = {}) => {
  const response = await fetch(`${fixtureBaseUrl}${path}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  assert(response.ok, `The lifecycle fixture transition failed (${response.status}).`);
  return await response.json();
};

const oldUrl = window.location.href;
window.location.hash = '/session';
window.dispatchEvent(new HashChangeEvent('hashchange', { oldURL: oldUrl, newURL: window.location.href }));
const picker = await waitUntil(() => {
  const candidate = document.querySelector('[data-testid="composer-target-picker"]');
  return visible(candidate) ? candidate : false;
}, { message: 'The workspace target picker did not appear.' });
picker.click();
const target = await waitUntil(() => Array.from(document.querySelectorAll('[data-testid="composer-target-option"]')).find((option) =>
  visible(option) && normalize(option.textContent).includes('Visual Workspace'),
) || false, { message: 'Visual Workspace was not selectable.' });
target.click();

const composer = () => Array.from(document.querySelectorAll('[data-testid="session-composer"]')).find(visible) || null;
await waitUntil(async () => {
  const root = composer();
  const pickerButton = document.querySelector('[data-testid="composer-target-picker"]');
  const editor = root?.querySelector('[data-composer-editor-instance]');
  if (!root || !editor || !pickerButton || pickerButton.disabled || !normalize(pickerButton.textContent).includes('Visual Workspace')) return false;
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  return composer() === root && editor.isConnected ? root : false;
}, { timeout: 45000, message: 'The Composer did not settle after selecting Visual Workspace.' });
const submitComposer = async () => {
  const button = await waitUntil(() => {
    const root = composer();
    return root && Array.from(root.querySelectorAll('button[aria-label="Queue message"]')).find((candidate) => visible(candidate) && !candidate.disabled) || false;
  }, { message: 'The active composer did not expose an enabled queue button.' });
  button.click();
};
const fixtureSessions = async () => {
  const response = await fetch(`${fixtureBaseUrl}/session`);
  assert(response.ok, `The lifecycle fixture session read failed (${response.status}).`);
  return await response.json();
};
const vesloConversations = async () => {
  const response = await serverRequest(
    localServer.baseUrl,
    localServer.token,
    `/workspace/${encodeURIComponent(workspaceId)}/conversations?directory=${encodeURIComponent(workspacePath)}`,
  );
  assert(response.ok && Array.isArray(response.body?.items), `The Veslo conversation list failed (${response.status}).`);
  return response.body.items;
};
const attachMsg = async (filename) => {
  const msgBytes = new Uint8Array(512);
  msgBytes.set([0xd0, 0xcf, 0x11, 0xe0, 0xa1, 0xb1, 0x1a, 0xe1]);
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    const fileInput = await waitUntil(() => composer()?.querySelector('input[type="file"]') || false, {
      message: 'The real composer did not expose its file input.',
    });
    const transfer = new DataTransfer();
    transfer.items.add(new File([msgBytes], filename, { type: 'application/octet-stream' }));
    Object.defineProperty(fileInput, 'files', { configurable: true, value: transfer.files });
    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
    try {
      await waitUntil(() => normalize(composer()?.textContent).includes(filename), {
        timeout: 3000,
        interval: 100,
        message: `The MSG file ${filename} was not accepted on attempt ${attempt}.`,
      });
      return;
    } catch (error) {
      if (attempt === 3) throw error;
    }
  }
};
const assertUnsupportedMsg = async ({ filename, baseline, sessionCount, conversationIds, branch }) => {
  const unsupportedAlert = await waitUntil(() => Array.from(document.querySelectorAll('[role="alert"]')).find((candidate) => {
    const text = normalize(candidate.textContent);
    return visible(candidate) && text.includes(filename) && text.includes('cannot read the MSG format') && text.includes('EML') && text.includes('PDF') && text.includes('TXT');
  }) || false, {
    timeout: 45000,
    message: `${branch}: the unsupported MSG result did not render an actionable visible error.`,
  });
  assert(normalize(unsupportedAlert.closest('[data-message-role="user"]')?.textContent).includes(filename), `${branch}: the MSG error was not scoped to its optimistic user row.`);
  const matchingAlerts = Array.from(document.querySelectorAll('[role="alert"]')).filter((candidate) => visible(candidate) && normalize(candidate.textContent).includes(filename));
  assert(matchingAlerts.length === 1, `${branch}: the MSG failure did not have exactly one visible owner.`);
  assert(!document.querySelector('[data-testid="session-run-indicator"]'), `${branch}: unsupported MSG admission left a run visibly active.`);
  const afterUnsupported = await fixtureState();
  assert(afterUnsupported.promptCalls === baseline.promptCalls, `${branch}: unsupported MSG bytes reached OpenCode prompt_async.`);
  assert(afterUnsupported.runs.length === baseline.runs.length, `${branch}: unsupported MSG admission created a durable run.`);
  assert((await fixtureSessions()).length === sessionCount, `${branch}: unsupported first-message admission materialized an OpenCode session.`);
  assert(
    JSON.stringify((await vesloConversations()).map((conversation) => conversation.id).sort()) === JSON.stringify([...conversationIds].sort()),
    `${branch}: unsupported MSG admission changed the durable Veslo conversation set.`,
  );
  await waitUntil(() => !normalize(composer()?.textContent).includes(filename), {
    message: `${branch}: the rejected MSG attachment remained armed in the Composer.`,
  });
};
const sendRecovery = async ({ baseline, text, answer, branch }) => {
  const editor = await waitUntil(() => {
    const candidate = composer()?.querySelector('[role="textbox"][contenteditable="true"]');
    return visible(candidate) ? candidate : false;
  }, { message: `${branch}: the chat composer did not remain usable after the MSG failure.` });
  insertContenteditableThroughBrowser(editor, text);
  await waitUntil(() => normalize(editor.textContent) === text, { message: `${branch}: the follow-up text was not accepted.` });
  await submitComposer();
  const run = await waitUntil(async () => {
    const state = await fixtureState();
    return state.promptCalls === baseline.promptCalls + 1 && state.runs.length === baseline.runs.length + 1
      ? state.runs.at(-1)
      : false;
  }, { timeout: 45000, interval: 200, message: `${branch}: the follow-up message was not admitted after the MSG failure.` });
  assert(normalize(run?.clientMessageId), `${branch}: the follow-up run did not retain its client message identity.`);
  const fixtureSessionList = await fixtureSessions();
  const engineSessionId = normalize(run?.engineSessionId) || normalize(fixtureSessionList.at(-1)?.id);
  assert(engineSessionId, `${branch}: the accepted follow-up did not materialize an OpenCode session.`);
  assert(!document.body.innerText.includes('A previous message is still synchronizing'), `${branch}: the failed MSG row kept the pending slot blocked.`);
  await waitUntil(() => window.location.hash.endsWith(`/session/${engineSessionId}`), {
    timeout: 45000,
    message: `${branch}: the materialized follow-up session did not become active before its answer.`,
  });
  await fixturePost('/__session_queue_fixture/emit-assistant-text-part', {
    sessionId: engineSessionId,
    messageId: `msg_assistant_${run.runId}`,
    partId: `part_text_${run.runId}`,
    text: answer,
  });
  await fixturePost(`/workspace/${encodeURIComponent(workspaceId)}/runs/${encodeURIComponent(run.runId)}/completed`);
  await fixturePost('/__session_queue_fixture/emit-session-idle', { sessionId: engineSessionId });
  await waitUntil(() => !document.querySelector('[data-testid="session-run-indicator"]'), {
    timeout: 45000,
    message: `${branch}: the accepted follow-up run did not reach a terminal visible state.`,
  });
  await waitUntil(() => Array.from(document.querySelectorAll('[data-message-role="assistant"]')).some((candidate) => visible(candidate) && normalize(candidate.textContent).includes(answer)), {
    timeout: 45000,
    message: `${branch}: the terminal follow-up did not render a visible assistant answer.`,
  });
  return run;
};

const newChatBaseline = await fixtureState();
const newChatSessionCount = (await fixtureSessions()).length;
const newChatConversationIds = (await vesloConversations()).map((conversation) => conversation.id);
await attachMsg('New-chat-message.msg');
await submitComposer();
await assertUnsupportedMsg({
  filename: 'New-chat-message.msg',
  baseline: newChatBaseline,
  sessionCount: newChatSessionCount,
  conversationIds: newChatConversationIds,
  branch: 'new chat',
});
const newChatFollowUpRun = await sendRecovery({
  baseline: newChatBaseline,
  text: 'new chat follow-up after unsupported MSG',
  answer: 'New chat recovered after MSG rejection.',
  branch: 'new chat',
});

const sessionId = 'ses-vslo-281-msg';
const title = 'VSLO-281 MSG attachment fixture';
await waitUntil(async () => (await fixtureState()).sseSubscriberCount > 0, {
  timeout: 45000,
  message: 'The desktop SSE bridge did not subscribe before session creation.',
});
const created = await fetch(`${fixtureBaseUrl}/session`, {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ id: sessionId, title, directory: workspacePath }),
});
assert(created.ok, `The fixture OpenCode session could not be created (${created.status}).`);
const imported = await serverRequest(
  localServer.baseUrl,
  localServer.token,
  `/workspace/${encodeURIComponent(workspaceId)}/conversations/import`,
  {
    method: 'POST',
    body: JSON.stringify({
      directory: workspacePath,
      sessions: [{ id: sessionId, title, parentID: null, time: { created: 1000, updated: 1000 } }],
    }),
  },
);
assert(imported.ok, `The fixture conversation import failed (${imported.status}).`);
await fixturePost('/__session_queue_fixture/append-session-transcript', {
  sessionId,
  messages: [],
  partsByMessageId: {},
});
const recovered = await serverRequest(
  localServer.baseUrl,
  localServer.token,
  `/workspace/${encodeURIComponent(workspaceId)}/sessions/${encodeURIComponent(sessionId)}/transcript/recover`,
  { method: 'POST', body: JSON.stringify({ directory: workspacePath }) },
);
assert(recovered.ok, `The fixture transcript recovery failed (${recovered.status}).`);
await fixturePost('/__session_queue_fixture/emit-session-created', { sessionId });

const existingSessionUrl = window.location.href;
window.location.hash = `/session/${sessionId}`;
window.dispatchEvent(new HashChangeEvent('hashchange', { oldURL: existingSessionUrl, newURL: window.location.href }));
await waitUntil(() => window.location.hash.endsWith(`/session/${sessionId}`), {
  message: 'The VSLO-281 fixture session did not become active.',
});
await waitUntil(() => {
  const editor = composer()?.querySelector('[role="textbox"][contenteditable="true"]');
  return editor && !document.body.innerText.includes('New chat recovered after MSG rejection.') ? editor : false;
}, {
  message: 'The existing VSLO-281 fixture did not load its active Composer.',
});

const initialFixture = await fixtureState();
const existingChatSessionCount = (await fixtureSessions()).length;
const existingChatConversationIds = (await vesloConversations()).map((conversation) => conversation.id);
await attachMsg('Zprava-z-webu.msg');
await submitComposer();
await assertUnsupportedMsg({
  filename: 'Zprava-z-webu.msg',
  baseline: initialFixture,
  sessionCount: existingChatSessionCount,
  conversationIds: existingChatConversationIds,
  branch: 'existing chat',
});
const followUpRun = await sendRecovery({
  baseline: initialFixture,
  text: 'existing chat follow-up after unsupported MSG',
  answer: 'Existing chat recovered after MSG rejection.',
  branch: 'existing chat',
});
const complete = document.createElement('div');
complete.dataset.testid = 'vslo-281-msg-complete';
complete.textContent = JSON.stringify({
  workspaceId,
  sessionId,
  newChatFollowUpRunId: newChatFollowUpRun.runId,
  existingChatFollowUpRunId: followUpRun.runId,
});
document.body.append(complete);
} catch (error) {
  appendFailure(error);
}
})();
}
true;
'''

[[step]]
name = "VSLO-281 flow finished"
action = "wait"
target = "[data-testid=\"vslo-281-msg-complete\"], [data-testid=\"vslo-281-msg-error\"]"
timeout_ms = 220000

[[step]]
name = "VSLO-281 flow succeeded"
action = "eval"
script = '''
const error = document.querySelector('[data-testid="vslo-281-msg-error"]');
if (error) throw new Error(`VSLO-281 scenario failed: ${(error.textContent || '').slice(0, 5000)}`);
true;
'''
