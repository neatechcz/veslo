[scenario]
name = "typography"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "typography CSS variables are exposed"
action = "eval"
timeout_ms = 30000
script = '''
const styles = getComputedStyle(document.documentElement);
const families = [
  styles.getPropertyValue("--veslo-font-reading"),
  styles.getPropertyValue("--veslo-font-product"),
  styles.getPropertyValue("--veslo-font-mono"),
].join(" ");
if (!/Source Sans 3|IBM Plex Sans|IBM Plex Mono|sans/i.test(families)) {
  throw new Error(`Expected typography variables were not exposed: ${families}`);
}
true;
'''
