[scenario]
name = "admin-managed-ai-access"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "settings AI access surface renders without user provider controls"
action = "eval"
timeout_ms = 45000
script = '''
window.localStorage.setItem("veslo.onboardingComplete", "1");
window.localStorage.setItem("veslo.language", "en");
const route = "/dashboard/settings";
const oldUrl = window.location.href;
window.location.hash = route;
window.dispatchEvent(new HashChangeEvent("hashchange", { oldURL: oldUrl, newURL: window.location.href }));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let text = "";
const deadline = Date.now() + 45000;
while (Date.now() < deadline) {
  text = document.body.innerText.replace(/\s+/g, " ").trim();
  if (window.location.hash.includes(route) && (text.includes("AI access") || text.includes("Run preferences") || text.length > 80)) break;
  await sleep(250);
}
if (!window.location.hash.includes(route)) throw new Error(`Settings route did not become active: ${window.location.hash}`);
if (!text) throw new Error("Settings page did not render visible text.");
if (text.includes("Connect provider") || text.includes("Change model")) {
  throw new Error("Admin-managed AI access exposed user-managed provider controls.");
}
true;
'''
