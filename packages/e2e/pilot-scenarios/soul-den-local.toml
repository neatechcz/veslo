[[step]]
name = "close soul modal"
action = "eval"
script = '''
document.querySelector('[data-testid="soul-source-modal-close"]')?.click();
true;
'''

[[step]]
name = "open settings audit"
action = "eval"
script = '''
const oldUrl = window.location.href;
window.location.hash = "/dashboard/settings";
window.dispatchEvent(new HashChangeEvent("hashchange", {
  oldURL: oldUrl,
  newURL: window.location.href,
}));
true;
'''

[[step]]
name = "settings audit panel visible"
action = "wait"
target = "[data-testid=\"settings-audit-log\"]"
timeout_ms = 40000

[[step]]
name = "check settings audit"
action = "eval"
script = '''
document.body.removeAttribute("data-soul-audit-visible");
const checkAudit = () => {
  const text = document.body.textContent ?? "";
  if (text.includes("Audit log") &&
    text.includes("Update Organization Soul") &&
    text.includes("soul.organization.update") &&
    text.includes("Update User Soul") &&
    text.includes("soul.user.update")) {
    document.body.setAttribute("data-soul-audit-visible", "1");
    return;
  }
  window.setTimeout(checkAudit, 250);
};
checkAudit();
true;
'''

[[step]]
name = "audit entries visible"
action = "wait"
target = "body[data-soul-audit-visible=\"1\"]"
timeout_ms = 40000
