[scenario]
name = "vslo-270-stop-reload-reconnect"
fail_fast = true
global_timeout_ms = 300000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "run blocked retry stop and reconnect sequence"
action = "eval"
script = '''
const completeSelector = '[data-testid="vslo-270-stop-reload-reconnect-complete"]';
const errorSelector = '[data-testid="vslo-270-stop-reload-reconnect-error"]';
const progressSelector = '[data-testid="vslo-270-stop-reload-reconnect-progress"]';
const readySelector = '[data-testid="vslo-270-stop-reload-reconnect-ready"]';
const stopReadySelector = '[data-testid="vslo-270-stop-reload-reconnect-stop-ready"]';
const pilotE2E = window.__vesloPilotE2E;
if (!pilotE2E) throw new Error("Pilot browser prelude is unavailable.");
document.querySelector(completeSelector)?.remove();
document.querySelector(errorSelector)?.remove();
document.querySelector(progressSelector)?.remove();
document.querySelector(readySelector)?.remove();
document.querySelector(stopReadySelector)?.remove();

const progressMarker = document.createElement("pre");
progressMarker.dataset.testid = "vslo-270-stop-reload-reconnect-progress";
progressMarker.style.display = "none";
progressMarker.textContent = "starting";
document.body.append(progressMarker);

const setProgress = (stage, detail = null) => {
  window.__veslo270StopReloadReconnect = {
    stage,
    detail,
    at: new Date().toISOString(),
  };
  progressMarker.textContent = JSON.stringify(window.__veslo270StopReloadReconnect);
};

const appendFailureMarker = (payload) => {
  if (document.querySelector(errorSelector) || document.querySelector(completeSelector)) return;
  const marker = document.createElement("pre");
  marker.dataset.testid = "vslo-270-stop-reload-reconnect-error";
  marker.textContent = JSON.stringify(payload, null, 2);
  document.body.append(marker);
};

if (!window.__veslo270StopReloadReconnectStarted) {
  window.__veslo270StopReloadReconnectStarted = true;
  window.__veslo270StopReloadReconnectNativeSendClick = null;
  window.__veslo270StopReloadReconnectNativeStopClick = null;
  window.__veslo270StopReloadReconnectPromise = (async () => {
    const overallTimeout = setTimeout(() => {
      appendFailureMarker({
        message: "Timed out before the VSLO-270 stop/reload/reconnect task produced a result marker.",
        progress: window.__veslo270StopReloadReconnect ?? null,
        trace: pilotE2E.recentTraceSummary(),
        body: document.body.innerText.replace(/\s+/g, " ").trim().slice(0, 3000),
      });
    }, 280000);

    try {
      const {
        normalize,
        assert,
        waitUntil: waitFor,
        invoke: tauriInvoke,
        visible,
      } = pilotE2E;
      const trimBaseUrl = (value) => normalize(value).replace(/\/+$/, "");
      const sendTrace = () => Array.isArray(window.__vesloSendTrace) ? window.__vesloSendTrace.slice(-160) : [];
      const bodyText = () => document.body.innerText.replace(/\s+/g, " ").trim();
      const waitUntil = (predicate, options = {}) => waitFor(predicate, {
        timeout: options.timeout ?? 10000,
        interval: options.interval ?? 250,
        message: options.message ?? "Condition was not met",
      });
      const serverJson = async (baseUrl, token, path, init = {}) => {
        const response = await fetch(`${baseUrl}${path}`, {
          ...init,
          headers: {
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            accept: "application/json",
            ...(init.headers ?? {}),
          },
        });
        const text = await response.text();
        let body = null;
        try {
          body = text ? JSON.parse(text) : null;
        } catch {
          body = text;
        }
        return { ok: response.ok, status: response.status, body };
      };
      const buttonDetails = () => Array.from(document.querySelectorAll("button")).map((button) => {
        return {
          text: normalize(button.textContent),
          title: normalize(button.title),
          label: normalize(button.getAttribute("aria-label")),
          disabled: button.disabled,
          visible: visible(button),
        };
      });
      const reloadBannerDetails = () => {
        const banner = document.querySelector('[data-testid="session-reload-banner"]');
        if (!(banner instanceof HTMLElement)) return null;
        const action = banner.querySelector('[data-testid="session-reload-action"]');
        return {
          text: normalize(banner.textContent),
          blocked: banner.getAttribute("data-reload-blocked"),
          visible: visible(banner),
          actionDisabled: action instanceof HTMLButtonElement ? action.disabled : null,
        };
      };
      const findBlockedReloadAction = () => {
        const action = document.querySelector('[data-testid="session-reload-banner"][data-reload-blocked="true"] [data-testid="session-reload-action"]');
        if (!(action instanceof HTMLButtonElement)) return null;
        if (action.disabled || !visible(action)) return null;
        return action;
      };
      const waitForComposer = async () => {
        setProgress("waiting-composer");
        return await waitUntil(() => {
          const candidate = document.querySelector('div[contenteditable="true"][role="textbox"][aria-multiline="true"], [role="textbox"]');
          return candidate instanceof HTMLElement && visible(candidate) ? candidate : false;
        }, {
          timeout: 30000,
          interval: 250,
          message: `Composer did not appear. Body=${bodyText().slice(0, 2000)}`,
        });
      };
      const waitForLocalVesloServerReady = async () => {
        let latest = null;
        setProgress("waiting-local-veslo-server");
        return await waitUntil(async () => {
          latest = await tauriInvoke("veslo_server_info").catch(() => null);
          const baseUrl = trimBaseUrl(latest?.baseUrl);
          const clientToken = normalize(latest?.clientToken);
          const hostToken = normalize(latest?.hostToken);
          if (!latest?.running || !baseUrl || !clientToken || !hostToken) return false;
          const response = await fetch(`${baseUrl}/health`).catch(() => null);
          if (!response?.ok) return false;
          const payload = await response.json().catch(() => null);
          return payload?.ok === true ? { baseUrl, clientToken, hostToken } : false;
        }, {
          timeout: 90000,
          interval: 500,
          message: `Local Veslo server did not become ready. Server info=${JSON.stringify(latest)}`,
        });
      };
      const parseDenAuth = (raw) => {
        if (!raw || typeof raw !== "string") return null;
        try {
          const parsed = JSON.parse(raw);
          const token = normalize(parsed?.token);
          if (!token) return null;
          return {
            token,
            email: normalize(parsed?.user?.email),
            userId: normalize(parsed?.user?.id),
            orgId: normalize(parsed?.orgId || parsed?.org?.id),
            denApiBase: trimBaseUrl(parsed?.denApiBase),
          };
        } catch {
          return null;
        }
      };
      const readDenAuthForAiAccess = async () => {
        const storageAuth = parseDenAuth(
          window.localStorage.getItem("veslo.den.auth") ||
          window.sessionStorage.getItem("veslo.den.auth"),
        );
        if (storageAuth) return storageAuth;

        const snapshot = await tauriInvoke("den_auth_snapshot_read", {}, 15000).catch(() => null);
        return parseDenAuth(snapshot?.authJson);
      };
      const waitForAiAccessReady = async (connection) => {
        let latest = null;
        setProgress("waiting-ai-access");
        await waitUntil(async () => {
          const auth = await readDenAuthForAiAccess();
          if (!auth?.token || !auth.email || auth.email.endsWith("@example.test")) {
            latest = { auth: auth ? { email: auth.email, userId: auth.userId, orgId: auth.orgId, denApiBase: auth.denApiBase, hasToken: Boolean(auth.token) } : null };
            return false;
          }
          const response = await fetch(`${connection.baseUrl}/ai-gateway/me/ai-access`, {
            headers: {
              authorization: `Bearer ${connection.clientToken}`,
              "x-veslo-gateway-authorization": `Bearer ${auth.token}`,
              accept: "application/json",
            },
          }).catch((error) => {
            latest = { error: error?.message || String(error) };
            return null;
          });
          if (!response) return false;
          const text = await response.text();
          latest = {
            status: response.status,
            body: text.slice(0, 500),
            auth: auth ? {
              email: auth.email,
              userId: auth.userId,
              orgId: auth.orgId,
              denApiBase: auth.denApiBase,
              hasToken: true,
            } : null,
          };
          if (!response.ok) return false;
          const payload = text.trim() ? JSON.parse(text) : null;
          return payload?.aiAccess?.enabled === true ? payload : false;
        }, {
          timeout: 90000,
          interval: 500,
          message: `AI access endpoint did not become ready. Latest=${JSON.stringify(latest)}`,
        });
        window.dispatchEvent(new Event("focus"));
        document.dispatchEvent(new Event("visibilitychange"));
      };
      const waitForWorkspaceEngineReady = async (workspace) => {
        const workspacePath = normalize(workspace?.path || workspace?.directory);
        assert(workspacePath, `Workspace path is missing from bootstrap payload: ${JSON.stringify(workspace)}`);
        setProgress("starting-workspace-engine", { workspacePath });
        const prepared = await tauriInvoke("runtime_prepare_workspace", {
          projectDir: workspacePath,
          workspaceId: normalize(workspace?.id) || null,
          workspaceName: normalize(workspace?.displayName || workspace?.name) || null,
          reason: "vslo-270-stop-reload-reconnect",
          forceFreshRuntime: false,
          preferSidecar: true,
          opencodeBinPath: null,
          runtime: "veslo-orchestrator",
          workspacePaths: [workspacePath],
        });
        assert(prepared?.ok === true,
          `Workspace runtime preparation failed: ${JSON.stringify(prepared)}`);
        return prepared;
      };
      const visibleRunIndicator = () => {
        const indicator = document.querySelector('[data-testid="session-run-indicator"]');
        if (!(indicator instanceof HTMLElement)) return null;
        const rect = indicator.getBoundingClientRect();
        if (!indicator.offsetParent || rect.width <= 0 || rect.height <= 0) return null;
        return {
          text: normalize(indicator.textContent),
          phase: indicator.getAttribute("data-run-phase") || "",
        };
      };
      const extractLifecycleScope = () => {
        const entries = sendTrace();
        for (let index = entries.length - 1; index >= 0; index -= 1) {
          const entry = entries[index];
          if (!entry || typeof entry !== "object") continue;
          const event = normalize(entry.event);
          if (
            event !== "server:conversation-run:lifecycle-register" &&
            event !== "server:conversation-run:opencode-submit" &&
            event !== "abortSession:conversation-abort-success"
          ) {
            continue;
          }
          const workspaceId = normalize(entry.workspaceId);
          const conversationId = normalize(entry.conversationId);
          const runId = normalize(entry.runId);
          if (workspaceId && conversationId && runId) {
            return { workspaceId, conversationId, runId, event };
          }
        }
        return null;
      };
      const captureNativePilotClick = (event) => {
        const target = event.target instanceof Element ? event.target.closest("button") : null;
        if (!(target instanceof HTMLButtonElement)) return;
        const targetTestId = normalize(target.dataset.testid);
        if (
          targetTestId === "session-composer-send-button" &&
          !window.__veslo270StopReloadReconnectNativeSendClick
        ) {
          window.__veslo270StopReloadReconnectNativeSendClick = {
            targetTestId,
            disabled: target.disabled,
            traceLength: sendTrace().length,
            at: new Date().toISOString(),
          };
          return;
        }
        if (
          targetTestId === "session-composer-stop-button" &&
          !window.__veslo270StopReloadReconnectNativeStopClick
        ) {
          window.__veslo270StopReloadReconnectNativeStopClick = {
            targetTestId,
            disabled: target.disabled,
            traceLength: sendTrace().length,
            at: new Date().toISOString(),
          };
        }
      };

      document.addEventListener("click", captureNativePilotClick, true);
      await waitUntil(() => document.querySelector("#root")?.children.length > 0, {
        timeout: 15000,
        message: "Veslo root did not render child UI",
      });

      setProgress("waiting-workspace-bootstrap");
      const workspaceList = await waitUntil(async () => {
        const info = await tauriInvoke("workspace_bootstrap").catch(() => null);
        return Array.isArray(info?.workspaces) && info.workspaces.length > 0 ? info : false;
      }, {
        timeout: 45000,
        interval: 500,
        message: "Workspace bootstrap did not expose a local workspace",
      });
      const activeWorkspace =
        workspaceList.workspaces.find((workspace) => workspace.id === workspaceList.activeId) ??
        workspaceList.workspaces[0];

      let localServer = await waitForLocalVesloServerReady();
      await waitForAiAccessReady(localServer);
      await waitForWorkspaceEngineReady(activeWorkspace);

      setProgress("ready-for-native-pilot-navigation");
      const readyMarker = document.createElement("div");
      readyMarker.dataset.testid = "vslo-270-stop-reload-reconnect-ready";
      readyMarker.style.display = "none";
      document.body.append(readyMarker);

      setProgress("waiting-native-pilot-navigation");
      await waitUntil(() => window.location.hash.includes("/session"), {
        timeout: 30000,
        message: "Pilot navigation did not activate the session route",
      });

      const textbox = await waitForComposer();
      assert(textbox instanceof HTMLElement, "Pilot navigation did not expose a visible composer.");
      setProgress("waiting-native-pilot-send");
      const nativeSendClick = await waitUntil(
        () => window.__veslo270StopReloadReconnectNativeSendClick || false,
        {
          timeout: 30000,
          interval: 150,
          message: "Pilot did not click the enabled composer send button",
        },
      );
      assert(
        nativeSendClick.targetTestId === "session-composer-send-button" && !nativeSendClick.disabled,
        `Invalid native send click: ${JSON.stringify(nativeSendClick)}`,
      );

      setProgress("waiting-send-handler", { clickedAt: nativeSendClick.at });
      await waitUntil(() => sendTrace().length > nativeSendClick.traceLength, {
        timeout: 10000,
        interval: 250,
        message: `Pilot send click did not reach composer handler. Buttons=${JSON.stringify(buttonDetails())}. Body=${bodyText().slice(0, 2000)}`,
      });

      setProgress("waiting-visible-model-retry");
      const retryIndicator = await waitUntil(() => {
        const indicator = visibleRunIndicator();
        if (!indicator) return false;
        if (!/Retrying model\/API|Opakuji model\/API/i.test(indicator.text)) return false;
        if (/tool|running tool|nastroj/i.test(indicator.text)) {
          throw new Error(`Retry-only wait looked like local tool work: ${JSON.stringify(indicator)}`);
        }
        return indicator;
      }, {
        timeout: 90000,
        interval: 500,
        message: `Model/API retry status did not become visible. Indicator=${JSON.stringify(visibleRunIndicator())}. Body=${bodyText().slice(0, 2500)}`,
      });
      assert(retryIndicator.phase === "retrying", `Expected data-run-phase=retrying, got ${JSON.stringify(retryIndicator)}`);

      setProgress("waiting-visible-model-retry-blocked", { retryIndicator });
      const blockedIndicator = await waitUntil(() => {
        const indicator = visibleRunIndicator();
        if (!indicator) return false;
        if (!/Model\/API retry blocked|Opakovani model\/API zablokovano/i.test(indicator.text)) return false;
        return indicator;
      }, {
        timeout: 90000,
        interval: 500,
        message: `Model/API retry did not become blocked. Indicator=${JSON.stringify(visibleRunIndicator())}. Body=${bodyText().slice(0, 2500)}`,
      });
      assert(blockedIndicator.phase === "error", `Expected data-run-phase=error for blocked retry, got ${JSON.stringify(blockedIndicator)}`);

      const lifecycleScope = await waitUntil(() => extractLifecycleScope(), {
        timeout: 15000,
        interval: 250,
        message: `Lifecycle scope was not captured in send trace. Trace=${JSON.stringify(sendTrace())}`,
      });

      await waitUntil(() => findBlockedReloadAction(), {
        timeout: 90000,
        interval: 250,
        message: `Blocked reload action was not visible for blocked backend run. Banner=${JSON.stringify(reloadBannerDetails())}. Buttons=${JSON.stringify(buttonDetails())}. Indicator=${JSON.stringify(visibleRunIndicator())}`,
      });
      setProgress("ready-for-native-pilot-stop", { lifecycleScope, banner: reloadBannerDetails() });
      const stopReadyMarker = document.createElement("div");
      stopReadyMarker.dataset.testid = "vslo-270-stop-reload-reconnect-stop-ready";
      stopReadyMarker.style.display = "none";
      document.body.append(stopReadyMarker);
      const nativeStopClick = await waitUntil(
        () => window.__veslo270StopReloadReconnectNativeStopClick || false,
        {
          timeout: 30000,
          interval: 150,
          message: "Pilot did not click the active composer Stop button",
        },
      );
      assert(
        nativeStopClick.targetTestId === "session-composer-stop-button" && !nativeStopClick.disabled,
        `Invalid native Stop click: ${JSON.stringify(nativeStopClick)}`,
      );

      const abortSuccess = await waitUntil(() => {
        return sendTrace()
          .slice(nativeStopClick.traceLength)
          .reverse()
          .find((entry) => entry?.event === "abortSession:conversation-abort-success") || false;
      }, {
        timeout: 30000,
        interval: 250,
        message: `Pilot Stop click did not reach Veslo conversation abort. Trace=${JSON.stringify(sendTrace())}`,
      });
      assert(normalize(abortSuccess.runId), `Abort success trace did not include runId: ${JSON.stringify(abortSuccess)}`);

      setProgress("waiting-active-run-clear", { lifecycleScope, abortSuccess });
      const activeCleared = await waitUntil(async () => {
        const active = await serverJson(
          localServer.baseUrl,
          localServer.clientToken,
          `/workspace/${encodeURIComponent(lifecycleScope.workspaceId)}/conversations/${encodeURIComponent(lifecycleScope.conversationId)}/runs/active`,
        ).catch((error) => ({ ok: false, status: 0, body: { error: error?.message || String(error) } }));
        if (active.status === 404) return { active };
        if (active.ok && /^(aborted|failed|completed)$/.test(normalize(active.body?.status))) return { active };
        return false;
      }, {
        timeout: 60000,
        interval: 1000,
        message: `Active lifecycle run did not clear after Stop. Scope=${JSON.stringify(lifecycleScope)} Trace=${JSON.stringify(sendTrace())}`,
      });

      setProgress("waiting-local-veslo-server-after-stop", { activeCleared });
      localServer = await waitForLocalVesloServerReady();
      const status = await serverJson(localServer.baseUrl, localServer.clientToken, "/status");
      assert(status.ok, `GET /status failed after Stop: ${JSON.stringify(status)}`);

      window.localStorage.setItem("veslo:e2e:vslo270:scope", JSON.stringify(lifecycleScope));
      window.localStorage.setItem("veslo:e2e:vslo270:reload-complete", new Date().toISOString());

      clearTimeout(overallTimeout);
      const completeMarker = document.createElement("div");
      completeMarker.dataset.testid = "vslo-270-stop-reload-reconnect-complete";
      completeMarker.textContent = "complete";
      document.body.append(completeMarker);
    } catch (error) {
      clearTimeout(overallTimeout);
      appendFailureMarker({
        message: error?.message || String(error),
        stack: error?.stack || null,
        progress: window.__veslo270StopReloadReconnect ?? null,
        trace: pilotE2E.recentTraceSummary(),
        indicator: (() => {
          const node = document.querySelector('[data-testid="session-run-indicator"]');
          return node instanceof HTMLElement
            ? {
                text: node.textContent,
                phase: node.getAttribute("data-run-phase"),
              }
            : null;
        })(),
        buttons: Array.from(document.querySelectorAll("button")).map((button) => {
          const rect = button.getBoundingClientRect();
          return {
            text: String(button.textContent ?? "").trim().replace(/\s+/g, " "),
            title: String(button.title ?? "").trim().replace(/\s+/g, " "),
            label: String(button.getAttribute("aria-label") ?? "").trim().replace(/\s+/g, " "),
            disabled: button.disabled,
            visible: Boolean(button.offsetParent) && rect.width > 0 && rect.height > 0,
          };
        }),
        body: document.body.innerText.replace(/\s+/g, " ").trim().slice(0, 3000),
      });
    } finally {
      document.removeEventListener("click", captureNativePilotClick, true);
    }
  })();
}

true;
'''

[[step]]
name = "production preflight is ready"
action = "wait"
target = "[data-testid=\"vslo-270-stop-reload-reconnect-ready\"], [data-testid=\"vslo-270-stop-reload-reconnect-error\"]"
timeout_ms = 120000

[[step]]
name = "production preflight succeeded"
action = "eval"
script = '''
const error = document.querySelector('[data-testid="vslo-270-stop-reload-reconnect-error"]');
if (error) throw new Error(`VSLO-270 preflight failed: ${(error.textContent || "unknown error").slice(0, 4000)}`);
true;
'''

[[step]]
name = "open session through Pilot navigation"
action = "navigate"
url = "http://tauri.localhost/#/session"
timeout_ms = 15000

[[step]]
name = "real session composer is visible"
action = "wait"
target = "[data-testid=\"session-composer-input\"]"
timeout_ms = 30000

[[step]]
name = "install shared Pilot contenteditable type adapter"
action = "eval"
script = '''
const pilotE2E = window.__vesloPilotE2E;
if (!pilotE2E) throw new Error("Pilot browser prelude is unavailable.");
pilotE2E.installContenteditableTypeAdapter();
true;
'''

[[step]]
name = "capture composer input events"
action = "eval"
script = '''
const input = document.querySelector('[data-testid="session-composer-input"]');
if (!(input instanceof HTMLElement)) throw new Error("Composer input is missing before Pilot type.");
window.__veslo270StopReloadReconnectComposerInputEvents = [];
input.addEventListener("input", (event) => {
  window.__veslo270StopReloadReconnectComposerInputEvents.push({
    type: event.type,
    inputType: event instanceof InputEvent ? event.inputType : null,
  });
}, { capture: true });
true;
'''

[[step]]
name = "focus live composer through Pilot"
action = "click"
target = "[data-testid=\"session-composer-input\"]"
timeout_ms = 15000

[[step]]
name = "type blocked-retry prompt through Pilot"
action = "type"
target = "[data-testid=\"session-composer-input\"]"
text = "Reply with exactly vslo-270-stop-reload. No other words."
timeout_ms = 15000

[[step]]
name = "Pilot browser edit populated composer"
action = "eval"
script = '''
const input = document.querySelector('[data-testid="session-composer-input"]');
const expected = "Reply with exactly vslo-270-stop-reload. No other words.";
const events = window.__veslo270StopReloadReconnectComposerInputEvents ?? [];
if (!(input instanceof HTMLElement) || input.textContent !== expected || !events.some((event) => event.type === "input")) {
  throw new Error(`Pilot type did not populate the composer through its input path: ${JSON.stringify({ text: input?.textContent ?? null, events })}`);
}
true;
'''

[[step]]
name = "queue button becomes enabled"
action = "wait"
target = "[data-testid=\"session-composer-send-button\"]:not([disabled])"
timeout_ms = 15000

[[step]]
name = "click queue button through Pilot"
action = "click"
target = "[data-testid=\"session-composer-send-button\"]"
timeout_ms = 15000

[[step]]
name = "blocked retry is ready for native Pilot Stop"
action = "wait"
target = "[data-testid=\"vslo-270-stop-reload-reconnect-stop-ready\"], [data-testid=\"vslo-270-stop-reload-reconnect-error\"]"
timeout_ms = 120000

[[step]]
name = "blocked retry preparation succeeded"
action = "eval"
script = '''
const error = document.querySelector('[data-testid="vslo-270-stop-reload-reconnect-error"]');
if (error) throw new Error(`VSLO-270 blocked retry failed: ${(error.textContent || "unknown error").slice(0, 4000)}`);
true;
'''

[[step]]
name = "active Stop button is visible"
action = "wait"
target = "[data-testid=\"session-composer-stop-button\"]:not([disabled])"
timeout_ms = 15000

[[step]]
name = "click Stop through Pilot"
action = "click"
target = "[data-testid=\"session-composer-stop-button\"]"
timeout_ms = 15000

[[step]]
name = "VSLO-270 task finished"
action = "wait"
target = "[data-testid=\"vslo-270-stop-reload-reconnect-complete\"], [data-testid=\"vslo-270-stop-reload-reconnect-error\"]"
timeout_ms = 290000

[[step]]
name = "VSLO-270 task succeeded"
action = "eval"
script = '''
const error = document.querySelector('[data-testid="vslo-270-stop-reload-reconnect-error"]');
if (error) {
  const detail = (error.textContent || "VSLO-270 stop/reload/reconnect task failed")
    .replace(/[\u0080-\uffff]/g, "?")
    .slice(0, 4000);
  throw new Error(`VSLO-270 stop/reload/reconnect task failed: ${detail}`);
}
true;
'''
