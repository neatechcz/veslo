[scenario]
name = "session-prefetch"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "session route can prefetch sidebar state without blocking UI"
action = "eval"
timeout_ms = 45000
script = '''
window.localStorage.setItem("veslo.onboardingComplete", "1");
window.localStorage.setItem("veslo.language", "en");
const route = "/session";
const oldUrl = window.location.href;
window.location.hash = route;
window.dispatchEvent(new HashChangeEvent("hashchange", { oldURL: oldUrl, newURL: window.location.href }));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let text = "";
const deadline = Date.now() + 45000;
while (Date.now() < deadline) {
  text = document.body.innerText.replace(/\s+/g, " ").trim();
  if (window.location.hash.includes(route) && text.length > 40) break;
  await sleep(250);
}
if (!window.location.hash.includes(route)) throw new Error(`Session route did not become active: ${window.location.hash}`);
if (!text) throw new Error("Session route did not render visible text.");
true;
'''
