[scenario]
name = "titlebar-window-controls"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "titlebar-capable shell renders"
action = "eval"
timeout_ms = 30000
script = '''
const root = document.querySelector("#root");
if (!root?.children.length) throw new Error("Root shell did not render for titlebar controls.");
true;
'''
