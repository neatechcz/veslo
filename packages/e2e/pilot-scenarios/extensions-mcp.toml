[scenario]
name = "extensions-mcp"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "extensions MCP page renders expected catalog controls"
action = "eval"
timeout_ms = 45000
script = '''
window.localStorage.setItem("veslo.onboardingComplete", "1");
window.localStorage.setItem("veslo.language", "en");
const route = "/dashboard/mcp";
const oldUrl = window.location.href;
window.location.hash = route;
window.dispatchEvent(new HashChangeEvent("hashchange", { oldURL: oldUrl, newURL: window.location.href }));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let text = "";
const deadline = Date.now() + 45000;
while (Date.now() < deadline) {
  text = document.body.innerText.replace(/\s+/g, " ").trim();
  if (document.querySelector('[data-testid="mcp-page"]') || text.includes("Control Chrome") || text.includes("MCP")) break;
  await sleep(250);
}
if (!window.location.hash.includes(route)) throw new Error(`MCP route did not become active: ${window.location.hash}`);
if (!text.includes("MCP") && !text.includes("Control Chrome")) throw new Error(`MCP page did not render expected controls. Body=${text.slice(0, 1000)}`);
true;
'''
