[scenario]
name = "sidebar-context-menu"
fail_fast = true
global_timeout_ms = 420000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "configure by-project sidebar mode"
action = "eval"
script = '''
window.localStorage.setItem("veslo.language", "en");
window.localStorage.setItem("veslo.sidebar-session-view.v1", "by-project");
window.localStorage.removeItem("veslo.sidebar-collapsed-projects.v1");
window.localStorage.removeItem("veslo.sidebar-chat-collapsed.v1");
true;
'''

[[step]]
name = "seed sidebar context menu session"
action = "eval"
script = '''
const completeSelector = '[data-testid="sidebar-context-menu-seed-complete"]';
const errorSelector = '[data-testid="sidebar-context-menu-seed-error"]';
document.querySelector(completeSelector)?.remove();
document.querySelector(errorSelector)?.remove();

const appendFailureMarker = (payload) => {
  if (document.querySelector(errorSelector) || document.querySelector(completeSelector)) return;
  const errorMarker = document.createElement("pre");
  errorMarker.dataset.testid = "sidebar-context-menu-seed-error";
  errorMarker.textContent = JSON.stringify(payload, null, 2);
  document.body.append(errorMarker);
};

if (!window.__vesloSidebarContextMenuSeedStarted) {
  window.__vesloSidebarContextMenuSeedStarted = true;
  window.__vesloSidebarContextMenuSeedPromise = (async () => {
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const trimText = (value) => String(value ?? "").trim();
    const normalize = (value) => trimText(value).replace(/\s+/g, " ");
    const normalizePath = (value) => trimText(value).replace(/\\/g, "/").replace(/\/+$/, "");
    const trimBaseUrl = (value) => normalize(value).replace(/\/+$/, "");
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const waitUntil = async (predicate, options = {}) => {
      const timeout = options.timeout ?? 10000;
      const interval = options.interval ?? 250;
      const message = options.message ?? "Condition was not met";
      const deadline = Date.now() + timeout;
      let latest;
      while (Date.now() < deadline) {
        latest = await predicate();
        if (latest) return latest;
        await sleep(interval);
      }
      throw new Error(`${message}. Latest=${JSON.stringify(latest)}`);
    };
    const tauriInvoke = async (command, payload = {}) => {
      const invoke = window.__TAURI_INTERNALS__?.invoke;
      assert(typeof invoke === "function", "Tauri invoke bridge is unavailable.");
      return await invoke(command, payload);
    };
    const waitForLocalVesloServerReady = async () => {
      let latest = null;
      return await waitUntil(async () => {
        latest = await tauriInvoke("veslo_server_info").catch(() => null);
        const baseUrl = trimBaseUrl(latest?.baseUrl);
        const clientToken = normalize(latest?.clientToken);
        const hostToken = normalize(latest?.hostToken);
        if (!latest?.running || !baseUrl || !clientToken || !hostToken) return false;
        const response = await fetch(`${baseUrl}/health`).catch(() => null);
        if (!response?.ok) return false;
        const payload = await response.json().catch(() => null);
        return payload?.ok === true ? { baseUrl, clientToken, hostToken } : false;
      }, {
        timeout: 90000,
        interval: 500,
        message: `Local Veslo server did not become ready. Server info=${JSON.stringify(latest)}`,
      });
    };
    const waitForWorkspaceEngineReady = async (workspace) => {
      const workspacePath = normalize(workspace?.path || workspace?.directory);
      assert(workspacePath, `Workspace path is missing from bootstrap payload: ${JSON.stringify(workspace)}`);
      let latest = null;
      return await waitUntil(async () => {
        latest = await tauriInvoke("engine_info").catch((error) => ({ error: error?.message || String(error) }));
        if (trimBaseUrl(latest?.baseUrl) && normalizePath(latest?.projectDir || latest?.directory) === normalizePath(workspacePath)) return latest;
        try {
          await tauriInvoke("engine_start", {
            projectDir: workspacePath,
            preferSidecar: true,
            opencodeBinPath: null,
            runtime: "veslo-orchestrator",
            workspacePaths: [workspacePath],
          });
          await tauriInvoke("orchestrator_workspace_activate", {
            workspacePath,
            name: normalize(workspace?.displayName || workspace?.name) || null,
          });
        } catch (error) {
          latest = { error: error?.message || String(error) };
          return false;
        }
        latest = await tauriInvoke("engine_info").catch((error) => ({ error: error?.message || String(error) }));
        return trimBaseUrl(latest?.baseUrl) ? latest : false;
      }, {
        timeout: 90000,
        interval: 1000,
        message: `Workspace engine did not become ready for ${workspacePath}. Latest=${JSON.stringify(latest)}`,
      });
    };
    const opencodeRequest = async (engineInfo, path, options = {}) => {
      const baseUrl = trimBaseUrl(engineInfo?.baseUrl);
      const directory = normalize(engineInfo?.projectDir || engineInfo?.directory);
      const username = normalize(engineInfo?.opencodeUsername || engineInfo?.username);
      const password = normalize(engineInfo?.opencodePassword || engineInfo?.password);
      assert(baseUrl, `Engine baseUrl missing: ${JSON.stringify(engineInfo)}`);
      assert(directory, `Engine directory missing: ${JSON.stringify(engineInfo)}`);
      const headers = new Headers(options.headers || {});
      headers.set("accept", "application/json");
      headers.set("x-opencode-directory", directory);
      if (username || password) {
        headers.set("authorization", `Basic ${btoa(`${username}:${password}`)}`);
      }
      if (options.body && !headers.has("content-type")) {
        headers.set("content-type", "application/json");
      }
      const response = await fetch(`${baseUrl}${path}`, {
        ...options,
        headers,
      });
      const text = await response.text();
      if (!response.ok) {
        throw new Error(`OpenCode request failed ${response.status} ${path}: ${text.slice(0, 1000)}`);
      }
      return text.trim() ? JSON.parse(text) : null;
    };
    const isPrivateWorkspace = (workspace) => {
      const workspacePath = normalizePath(workspace?.path || workspace?.directory);
      return workspacePath.includes("/private-workspaces/");
    };

    try {
      window.localStorage.setItem("veslo.language", "en");
      window.localStorage.setItem("veslo.sidebar-session-view.v1", "by-project");
      window.localStorage.removeItem("veslo.sidebar-collapsed-projects.v1");
      window.localStorage.removeItem("veslo.sidebar-chat-collapsed.v1");

      await waitUntil(() => document.querySelector("#root")?.children.length > 0, {
        timeout: 15000,
        message: "Veslo root did not render child UI",
      });
      await waitForLocalVesloServerReady();
      const workspaceList = await waitUntil(async () => {
        const info = await tauriInvoke("workspace_bootstrap").catch(() => null);
        return Array.isArray(info?.workspaces) && info.workspaces.length > 0 ? info : false;
      }, {
        timeout: 45000,
        interval: 500,
        message: "Workspace bootstrap did not expose a local workspace",
      });
      const activeWorkspace = workspaceList.workspaces.find((workspace) => workspace.id === workspaceList.activeId) ?? workspaceList.workspaces[0];
      const projectWorkspace = !isPrivateWorkspace(activeWorkspace)
        ? activeWorkspace
        : workspaceList.workspaces.find((workspace) => !isPrivateWorkspace(workspace));
      assert(projectWorkspace?.id, `No project workspace was available for sidebar context menu seeding: ${JSON.stringify(workspaceList)}`);
      if (projectWorkspace.id !== workspaceList.activeId) {
        await tauriInvoke("workspace_set_active", {
          workspaceId: projectWorkspace.id,
          promoteToFront: true,
        });
      }

      const engineInfo = await waitForWorkspaceEngineReady(projectWorkspace);
      const directory = normalize(projectWorkspace.path || projectWorkspace.directory || engineInfo.projectDir);
      const engineContext = {
        ...engineInfo,
        projectDir: directory,
        directory,
      };
      await opencodeRequest(engineContext, "/global/health");

      const title = `Sidebar context menu ${Date.now()}`;
      const createdPayload = await opencodeRequest(
        engineContext,
        `/session?directory=${encodeURIComponent(directory)}`,
        {
          method: "POST",
          body: JSON.stringify({ title }),
        },
      );
      const created = createdPayload?.data ?? createdPayload;
      assert(created?.id, `Session create did not return an id: ${JSON.stringify(createdPayload)}`);

      window.localStorage.setItem(
        "veslo.e2e.sidebarContextMenu.seed",
        JSON.stringify({
          title,
          sessionId: created.id,
          workspaceId: projectWorkspace.id,
          directory,
        }),
      );
      const completeMarker = document.createElement("div");
      completeMarker.dataset.testid = "sidebar-context-menu-seed-complete";
      completeMarker.textContent = "complete";
      document.body.append(completeMarker);
    } catch (error) {
      appendFailureMarker({
        message: error?.message || String(error),
        stack: error?.stack || null,
      });
    }
  })();
}

true;
'''

[[step]]
name = "seed task finished"
action = "wait"
target = "[data-testid=\"sidebar-context-menu-seed-complete\"], [data-testid=\"sidebar-context-menu-seed-error\"]"
timeout_ms = 180000

[[step]]
name = "seed task succeeded"
action = "eval"
script = '''
const error = document.querySelector('[data-testid="sidebar-context-menu-seed-error"]');
if (error) {
  throw new Error(`Sidebar context menu seed failed: ${(error.textContent || "").slice(0, 4000)}`);
}
true;
'''

[[step]]
name = "reload after seed"
action = "eval"
script = '''
window.location.reload();
true;
'''

[[step]]
name = "root exists after reload"
action = "wait"
target = "#root"
timeout_ms = 30000

[[step]]
name = "install sidebar context menu helpers"
action = "eval"
script = '''
window.__vesloSidebarContextMenu = (() => {
  const labels = {
    editName: "Edit name",
    archiveSession: "Archive session",
    removeWorkspace: "Remove from Veslo",
    addDirectoryOrProject: "Add directory / project",
    archivedItems: "Archived items",
    searchSessions: "Search sessions",
    deleteSession: "Delete session",
    copy: "Copy",
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const normalize = (value) => String(value ?? "").trim().replace(/\s+/g, " ");
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const bodyText = () => normalize(document.body.innerText || document.body.textContent || "");
  const waitUntil = async (predicate, options = {}) => {
    const timeout = options.timeout ?? 10000;
    const interval = options.interval ?? 150;
    const message = options.message ?? "Condition was not met";
    const deadline = Date.now() + timeout;
    let latest = null;
    while (Date.now() < deadline) {
      latest = await predicate();
      if (latest) return latest;
      await sleep(interval);
    }
    throw new Error(`${message}. Latest=${JSON.stringify(latest)} Body=${bodyText().slice(0, 2500)}`);
  };
  const navigateToHash = (path) => {
    const oldUrl = window.location.href;
    window.location.hash = path.startsWith("/") ? path : `/${path}`;
    window.dispatchEvent(new HashChangeEvent("hashchange", {
      oldURL: oldUrl,
      newURL: window.location.href,
    }));
  };
  const seed = () => {
    const payload = JSON.parse(window.localStorage.getItem("veslo.e2e.sidebarContextMenu.seed") || "null");
    assert(payload?.title, `Missing sidebar context menu seed payload: ${JSON.stringify(payload)}`);
    return payload;
  };
  const isVisibleElement = (element) => {
    if (!(element instanceof HTMLElement)) return false;
    const rect = element.getBoundingClientRect();
    const style = window.getComputedStyle(element);
    return rect.width > 0 && rect.height > 0 && style.display !== "none" && style.visibility !== "hidden";
  };
  const rowElements = () => Array.from(document.querySelectorAll('[data-session-sidebar-row="true"]')).filter(isVisibleElement);
  const rowTexts = () => rowElements().map((row) => normalize(row.textContent));
  const seedRows = () => {
    const title = seed().title;
    return rowElements().filter((row) =>
      !row.closest('[data-sidebar-chat-section="true"]') &&
      normalize(row.textContent).includes(title));
  };
  const waitForSeedRow = async (timeout = 90000) => {
    const title = seed().title;
    let latestRows = [];
    return await waitUntil(() => {
      latestRows = rowTexts();
      return seedRows()[0] || false;
    }, {
      timeout,
      interval: 500,
      message: `Seeded project sidebar row did not appear for ${title}. Rows=${JSON.stringify(latestRows)}`,
    });
  };
  const pointInElement = (element) => {
    const rect = element.getBoundingClientRect();
    assert(rect.width > 0 && rect.height > 0, `Element has no context-menu point: ${element.outerHTML?.slice(0, 500)}`);
    return {
      x: Math.round(rect.left + Math.min(Math.max(8, rect.width / 2), Math.max(8, rect.width - 8))),
      y: Math.round(rect.top + Math.min(Math.max(8, rect.height / 2), Math.max(8, rect.height - 8))),
    };
  };
  const dispatchContextMenu = (element, point = pointInElement(element)) => {
    element.dispatchEvent(new MouseEvent("contextmenu", {
      bubbles: true,
      cancelable: true,
      composed: true,
      view: window,
      button: 2,
      buttons: 2,
      clientX: point.x,
      clientY: point.y,
    }));
  };
  const waitForMenu = async (selector) => await waitUntil(() => {
    const candidate = document.querySelector(selector);
    return isVisibleElement(candidate) ? candidate : false;
  }, {
    timeout: 10000,
    interval: 100,
    message: `Menu ${selector} did not open. Rows=${JSON.stringify(rowTexts())}`,
  });
  const menuItems = (menu) => Array.from(menu.querySelectorAll('[role="menuitem"]')).filter(isVisibleElement);
  const menuItemTexts = (menu) => menuItems(menu).map((item) => normalize(item.textContent));
  const menuItemByText = (menu, label) => menuItems(menu).find((item) => normalize(item.textContent) === label);
  const clickElement = (element) => {
    element.focus?.();
    const base = {
      bubbles: true,
      cancelable: true,
      composed: true,
      view: window,
      button: 0,
    };
    if (typeof PointerEvent === "function") {
      element.dispatchEvent(new PointerEvent("pointerdown", {
        ...base,
        pointerId: 1,
        pointerType: "mouse",
        isPrimary: true,
        buttons: 1,
      }));
      element.dispatchEvent(new PointerEvent("pointerup", {
        ...base,
        pointerId: 1,
        pointerType: "mouse",
        isPrimary: true,
        buttons: 0,
      }));
    }
    element.dispatchEvent(new MouseEvent("mousedown", { ...base, buttons: 1 }));
    element.dispatchEvent(new MouseEvent("mouseup", { ...base, buttons: 0 }));
    element.dispatchEvent(new MouseEvent("click", { ...base, buttons: 0 }));
  };
  const closeMenusWithEscape = async () => {
    window.dispatchEvent(new KeyboardEvent("keydown", {
      key: "Escape",
      code: "Escape",
      bubbles: true,
      cancelable: true,
      composed: true,
    }));
    await waitUntil(() =>
      !document.querySelector('[data-testid="sidebar-context-menu"]') &&
      !document.querySelector('[data-testid="session-workspace-context-menu"]'),
    {
      timeout: 5000,
      interval: 100,
      message: "Context menu did not close after Escape",
    });
  };
  const projectHeaderForRow = (row) => {
    const projectRoot = row.closest("[data-project-key]");
    assert(projectRoot instanceof HTMLElement, `Seed row is not inside a project group: ${row.outerHTML?.slice(0, 1000)}`);
    const headerButton = projectRoot.querySelector('button[data-project-collapse-toggle="true"]') ?? projectRoot.querySelector("button");
    assert(headerButton instanceof HTMLElement, `Project header button was not found: ${projectRoot.outerHTML?.slice(0, 1000)}`);
    return headerButton;
  };
  const titleElementForRow = (row) => {
    const title = seed().title;
    const candidates = Array.from(row.querySelectorAll("span[title], span")).filter(isVisibleElement);
    const titleElement = candidates.find((candidate) => normalize(candidate.textContent).includes(title)) ?? candidates[0] ?? row;
    assert(titleElement instanceof HTMLElement, `Session title element was not found for ${title}`);
    return titleElement;
  };
  const scrollContainerForRow = (row) => {
    let candidate = row.parentElement;
    while (candidate instanceof HTMLElement) {
      const style = window.getComputedStyle(candidate);
      if (/(auto|scroll)/.test(style.overflowY) && candidate.querySelector('[data-session-sidebar-row="true"]')) {
        return candidate;
      }
      candidate = candidate.parentElement;
    }
    throw new Error(`Session list scroll container was not found for row: ${row.outerHTML?.slice(0, 1000)}`);
  };
  const backgroundPointForRow = (row) => {
    const container = scrollContainerForRow(row);
    const rect = container.getBoundingClientRect();
    const rows = rowElements().filter((candidate) => container.contains(candidate));
    const rowBottom = rows.reduce((bottom, candidate) => Math.max(bottom, candidate.getBoundingClientRect().bottom), rect.top);
    const xs = [
      Math.round(rect.left + rect.width / 2),
      Math.round(rect.left + Math.min(24, Math.max(8, rect.width - 8))),
      Math.round(rect.right - Math.min(24, Math.max(8, rect.width - 8))),
    ];
    for (let y = Math.round(rowBottom + 8); y <= Math.round(rect.bottom - 8); y += 8) {
      for (const x of xs) {
        const hit = document.elementFromPoint(x, y);
        if (hit === container) {
          return { container, point: { x, y } };
        }
      }
    }
    throw new Error(`Could not find a background point targeting the session list container. Container=${JSON.stringify({
      top: rect.top,
      bottom: rect.bottom,
      left: rect.left,
      right: rect.right,
      rowBottom,
      rowCount: rows.length,
    })}`);
  };

  return {
    labels,
    sleep,
    normalize,
    assert,
    bodyText,
    waitUntil,
    navigateToHash,
    seed,
    isVisibleElement,
    rowElements,
    rowTexts,
    seedRows,
    waitForSeedRow,
    pointInElement,
    dispatchContextMenu,
    waitForMenu,
    menuItems,
    menuItemTexts,
    menuItemByText,
    clickElement,
    closeMenusWithEscape,
    projectHeaderForRow,
    titleElementForRow,
    scrollContainerForRow,
    backgroundPointForRow,
  };
})();

window.localStorage.setItem("veslo.language", "en");
window.localStorage.setItem("veslo.sidebar-session-view.v1", "by-project");
window.localStorage.removeItem("veslo.sidebar-collapsed-projects.v1");
window.localStorage.removeItem("veslo.sidebar-chat-collapsed.v1");
window.__vesloSidebarContextMenu.navigateToHash("/session");
await window.__vesloSidebarContextMenu.waitUntil(() => window.location.hash.includes("/session"), {
  timeout: 10000,
  message: "Session route did not become active",
});
await window.__vesloSidebarContextMenu.waitForSeedRow();
true;
'''

[[step]]
name = "open session row context menu"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
const row = await h.waitForSeedRow();
h.dispatchContextMenu(row);
await h.waitForMenu('[data-testid="sidebar-context-menu"]');
true;
'''

[[step]]
name = "session row menu has session actions"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
const menu = await h.waitForMenu('[data-testid="sidebar-context-menu"]');
const texts = h.menuItemTexts(menu);
h.assert(texts.includes(h.labels.editName), `Missing rename item. Items=${JSON.stringify(texts)}`);
h.assert(texts.includes(h.labels.archiveSession), `Missing archive item. Items=${JSON.stringify(texts)}`);
h.assert(texts.at(-1) === h.labels.deleteSession, `Delete session should be the final menu item. Items=${JSON.stringify(texts)}`);
h.assert(!texts.some((text) => text === "Open" || text.startsWith("Open ")), `Session menu unexpectedly includes Open. Items=${JSON.stringify(texts)}`);
h.assert(!texts.includes(h.labels.removeWorkspace), `Session menu unexpectedly includes remove workspace. Items=${JSON.stringify(texts)}`);
true;
'''

[[step]]
name = "escape closes session row menu"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
await h.closeMenusWithEscape();
true;
'''

[[step]]
name = "project header context menu has remove workspace"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
const row = await h.waitForSeedRow();
const header = h.projectHeaderForRow(row);
h.dispatchContextMenu(header);
const menu = await h.waitForMenu('[data-testid="session-workspace-context-menu"]');
const texts = h.menuItemTexts(menu);
h.assert(texts.includes(h.labels.removeWorkspace), `Project context menu missing remove workspace. Items=${JSON.stringify(texts)}`);
await h.closeMenusWithEscape();
true;
'''

[[step]]
name = "background context menu has only background actions"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
const row = await h.waitForSeedRow();
const { container, point } = h.backgroundPointForRow(row);
h.dispatchContextMenu(container, point);
const menu = await h.waitForMenu('[data-testid="sidebar-context-menu"]');
const texts = h.menuItemTexts(menu);
const expected = [
  h.labels.addDirectoryOrProject,
  h.labels.searchSessions,
  h.labels.archivedItems,
];
h.assert(
  JSON.stringify(texts) === JSON.stringify(expected),
  `Background context menu items did not match. Expected=${JSON.stringify(expected)} Actual=${JSON.stringify(texts)}`,
);
await h.closeMenusWithEscape();
true;
'''

[[step]]
name = "selected row text adds copy menu item"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
const row = await h.waitForSeedRow();
const title = h.titleElementForRow(row);
const selection = window.getSelection();
h.assert(selection, "Window selection is unavailable");
selection.removeAllRanges();
selection.selectAllChildren(title);
h.dispatchContextMenu(row);
const menu = await h.waitForMenu('[data-testid="sidebar-context-menu"]');
const texts = h.menuItemTexts(menu);
h.assert(texts[0] === h.labels.copy, `Copy should be the first menu item when row text is selected. Items=${JSON.stringify(texts)}`);
await h.closeMenusWithEscape();
selection.removeAllRanges();
true;
'''

[[step]]
name = "archive menu item removes visible row"
action = "eval"
script = '''
const h = window.__vesloSidebarContextMenu;
window.getSelection()?.removeAllRanges();
const seed = h.seed();
const row = await h.waitForSeedRow();
const beforeRows = h.rowTexts();
const beforeMatchingRows = beforeRows.filter((text) => text.includes(seed.title));
h.assert(beforeMatchingRows.length === 1, `Expected one visible seeded row before archive. Rows=${JSON.stringify(beforeRows)}`);

h.dispatchContextMenu(row);
const menu = await h.waitForMenu('[data-testid="sidebar-context-menu"]');
const archiveItem = h.menuItemByText(menu, h.labels.archiveSession);
h.assert(archiveItem, `Archive item was not found. Items=${JSON.stringify(h.menuItemTexts(menu))}`);
h.clickElement(archiveItem);

let latestRows = [];
await h.waitUntil(() => {
  latestRows = h.rowTexts();
  return latestRows.length < beforeRows.length && !latestRows.some((text) => text.includes(seed.title));
}, {
  timeout: 60000,
  interval: 500,
  message: `Archived row stayed visible. Before=${JSON.stringify(beforeRows)} Latest=${JSON.stringify(latestRows)}`,
});
await h.sleep(1200);
const afterRows = h.rowTexts();
h.assert(afterRows.length < beforeRows.length, `Sidebar row count did not drop after archive. Before=${JSON.stringify(beforeRows)} After=${JSON.stringify(afterRows)}`);
h.assert(!afterRows.some((text) => text.includes(seed.title)), `Archived seed row reappeared after settle. After=${JSON.stringify(afterRows)}`);
true;
'''
