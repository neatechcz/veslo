[scenario]
name = "smoke"
fail_fast = true

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "root has rendered children"
action = "wait"
target = "#root > *"
timeout_ms = 30000

[[step]]
name = "body is visible"
action = "assert-visible"
target = "body"
