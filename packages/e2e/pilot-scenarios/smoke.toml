[scenario]
name = "smoke"
fail_fast = true

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "root has rendered children"
action = "eval"
script = """
const root = document.querySelector('#root');
if (!root || root.children.length === 0) {
  throw new Error('Veslo root did not render child UI');
}
true;
"""

[[step]]
name = "body is visible"
action = "assert-visible"
target = "body"
