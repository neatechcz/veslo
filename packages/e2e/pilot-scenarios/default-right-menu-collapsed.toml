[scenario]
name = "default-right-menu-collapsed"
fail_fast = true

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "clear sidebar prefs and reload"
action = "eval"
script = """
const globalKey = 'veslo.global.sidebar.docked.v1';
const legacyKey = 'veslo.session.sidebar.docked.v1';
window.localStorage.removeItem(globalKey);
window.localStorage.removeItem(legacyKey);
window.location.reload();
true;
"""

[[step]]
name = "root exists after preference reset"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "global sidebar preference remains unset"
action = "eval"
script = """
const globalKey = 'veslo.global.sidebar.docked.v1';
const legacyKey = 'veslo.session.sidebar.docked.v1';
if (window.localStorage.getItem(globalKey) !== null) {
  throw new Error(`Expected default launch not to write ${globalKey}`);
}
if (window.localStorage.getItem(legacyKey) !== null) {
  throw new Error(`Expected default launch not to write ${legacyKey}`);
}
true;
"""

[[step]]
name = "navigate to session"
action = "eval"
script = """
const oldUrl = window.location.href;
window.location.hash = '/session';
window.dispatchEvent(new HashChangeEvent('hashchange', {
  oldURL: oldUrl,
  newURL: window.location.href,
}));
true;
"""

[[step]]
name = "session route active"
action = "assert-url"
expected = "/session"
timeout_ms = 10000

[[step]]
name = "session right menu starts collapsed"
action = "eval"
script = """
function isVisible(element) {
  const rect = element.getBoundingClientRect();
  const style = window.getComputedStyle(element);
  return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
}

const visibleRightMenus = Array.from(document.querySelectorAll('aside'))
  .filter((element) => {
    const className = String(element.getAttribute('class') ?? '');
    return className.includes('border-l') && className.includes('bg-dls-sidebar') && isVisible(element);
  });

if (visibleRightMenus.length > 0) {
  throw new Error(`Expected no visible right sidebar menus on first session launch; found ${visibleRightMenus.length}`);
}
true;
"""

[[step]]
name = "navigate to dashboard settings"
action = "eval"
script = """
const oldUrl = window.location.href;
window.location.hash = '/dashboard/settings';
window.dispatchEvent(new HashChangeEvent('hashchange', {
  oldURL: oldUrl,
  newURL: window.location.href,
}));
true;
"""

[[step]]
name = "dashboard settings route active"
action = "assert-url"
expected = "/dashboard/settings"
timeout_ms = 10000

[[step]]
name = "dashboard right menu starts collapsed"
action = "eval"
script = """
function isVisible(element) {
  const rect = element.getBoundingClientRect();
  const style = window.getComputedStyle(element);
  return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
}

const visibleRightMenus = Array.from(document.querySelectorAll('aside'))
  .filter((element) => {
    const className = String(element.getAttribute('class') ?? '');
    return className.includes('border-l') && className.includes('bg-dls-sidebar') && isVisible(element);
  });

if (visibleRightMenus.length > 0) {
  throw new Error(`Expected no visible right sidebar menus on first dashboard launch; found ${visibleRightMenus.length}`);
}
true;
"""
