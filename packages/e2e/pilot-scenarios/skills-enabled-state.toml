name = "open platform detail"
action = "eval"
script = '''
const selector = '[data-testid="skill-inventory-card"][data-skill-inventory-name="e2e-enable-platform-skill"][data-skill-inventory-scope="platform"], [data-testid="skill-inventory-table-row"][data-skill-inventory-name="e2e-enable-platform-skill"][data-skill-inventory-scope="platform"]';
