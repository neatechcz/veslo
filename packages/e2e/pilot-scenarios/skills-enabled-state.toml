timeout_ms = 45000

[[step]]
name = "open organization detail"
action = "eval"
script = '''
const selector = '[data-testid="skill-inventory-card"][data-skill-inventory-name="e2e-enable-org-skill"][data-skill-inventory-scope="organization"], [data-testid="skill-inventory-table-row"][data-skill-inventory-name="e2e-enable-org-skill"][data-skill-inventory-scope="organization"]';
const button = document.querySelector(selector)?.querySelector('[data-testid="skill-inventory-detail-button"]');
if (!(button instanceof HTMLButtonElement)) throw new Error("Organization detail button was not found");
button.click();
true;
'''

[[step]]
name = "organization detail is visible"
action = "wait"
target = '[data-testid="skill-detail-drawer"]'
timeout_ms = 10000

[[step]]
name = "organization detail is read-only"
action = "eval"
script = '''
const drawer = document.querySelector('[data-testid="skill-detail-drawer"]');
if (!(drawer instanceof HTMLElement)) throw new Error("Organization detail drawer was not found");
const buttonTexts = Array.from(drawer.querySelectorAll("button")).map((candidate) =>
  (candidate.textContent ?? "").replace(/\s+/g, " ").trim()
);
if (document.querySelector("textarea") || buttonTexts.includes("Edit") || buttonTexts.includes("Upravit")) {
  throw new Error(`Organization managed detail exposed source editing. Buttons=${JSON.stringify(buttonTexts)}`);
}
drawer.querySelector("button[aria-label]")?.click();
true;
'''

