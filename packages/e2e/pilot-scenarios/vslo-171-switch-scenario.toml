[scenario]
name = "vslo-171-switch-scenario"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "root exists"
action = "wait"
target = "#root"
timeout_ms = 15000

[[step]]
name = "session switch scenario route renders"
action = "eval"
timeout_ms = 45000
script = '''
window.localStorage.setItem("veslo.onboardingComplete", "1");
const oldUrl = window.location.href;
window.location.hash = "/session";
window.dispatchEvent(new HashChangeEvent("hashchange", { oldURL: oldUrl, newURL: window.location.href }));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const deadline = Date.now() + 45000;
while (Date.now() < deadline && !document.querySelector('textarea, [role="textbox"], [contenteditable="true"]')) await sleep(250);
if (!document.querySelector('textarea, [role="textbox"], [contenteditable="true"]')) throw new Error("Session composer did not render for VSLO-171 switch scenario.");
true;
'''
