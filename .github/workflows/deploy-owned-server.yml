name: Deploy Owned Server

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy. Leave empty to use the workflow ref."
        required: false
        type: string
        default: ""
      install_backup_timer:
        description: "Install or update the owned-server daily database backup scheduler."
        required: true
        type: boolean
        default: true
      run_backup_now:
        description: "Run one owned-server database backup after a successful deployment."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-owned-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, veslo-owned-server]
    if: github.repository == 'neatechcz/veslo'
    env:
      OWNED_SERVER_APP_DIR: ${{ vars.OWNED_SERVER_APP_DIR || '/home/neatech/veslo-owned-server-production' }}
      OWNED_SERVER_ENV_FILE: ${{ vars.OWNED_SERVER_ENV_FILE || '/home/neatech/veslo-owned-server-dark-launch-inputs/env/production.env' }}
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      INSTALL_BACKUP_TIMER: ${{ inputs.install_backup_timer }}
      RUN_BACKUP_NOW: ${{ inputs.run_backup_now }}
      VESLO_DEPLOYMENT_DOMAIN: ${{ vars.VESLO_DEPLOYMENT_DOMAIN || 'veslo.work' }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate owned-server deploy configuration
        run: |
          set -euo pipefail

          missing=0
          for key in OWNED_SERVER_APP_DIR OWNED_SERVER_ENV_FILE DEPLOY_BRANCH REPO_URL GITHUB_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required owned-server deployment value: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy Compose stack on owned server
        run: |
          set -euo pipefail

          git_auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          git_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth_header" \
            git "$@"
          }

          if [ ! -d "$OWNED_SERVER_APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$OWNED_SERVER_APP_DIR")"
            git_auth clone "$REPO_URL" "$OWNED_SERVER_APP_DIR"
          fi

          cd "$OWNED_SERVER_APP_DIR"
          git reset --hard
          git clean -fd
          git_auth fetch --prune origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git checkout --force --detach "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          git clean -fd

          test -f "$OWNED_SERVER_ENV_FILE"
          test -f packaging/owned-server/compose.yml

          compose() {
            sudo -n docker compose -f packaging/owned-server/compose.yml --env-file "$OWNED_SERVER_ENV_FILE" "$@"
          }

          compose config --quiet
          compose build worker-runtime-image worker-manager backup den ai-gateway web
          compose up -d den-db ai-gateway-db worker-manager
          compose run --rm --no-deps den pnpm --filter @neatech/den db:migrate
          compose run --rm --no-deps ai-gateway pnpm --filter @neatech/ai-gateway db:migrate
          compose up -d
          compose ps
          compose exec -T worker-manager node -e "fetch('http://127.0.0.1:8790/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Verify public production endpoints
        run: |
          set -euo pipefail

          deployment_domain="${VESLO_DEPLOYMENT_DOMAIN#http://}"
          deployment_domain="${deployment_domain#https://}"
          deployment_domain="${deployment_domain%%/*}"
          deployment_domain="${deployment_domain#api.}"
          deployment_domain="${deployment_domain#ai.}"
          deployment_domain="${deployment_domain#app.}"
          deployment_domain="${deployment_domain#admin.}"
          deployment_domain="${deployment_domain#workers.}"

          api_url="https://api.${deployment_domain}"
          ai_url="https://ai.${deployment_domain}"
          app_url="https://app.${deployment_domain}"

          curl -fsS "$api_url/health"
          curl -fsS "$ai_url/health"
          curl -fsSI "$app_url" >/dev/null

          root_response="$(curl -fsS "$api_url/")"
          printf '%s\n' "$root_response" | grep -F '"service":"veslo-den"' >/dev/null

          assert_unauthenticated_json_route() {
            path="$1"
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' "$api_url$path")"
            if [ "$status" != "401" ]; then
              echo "::error::$api_url$path expected 401 JSON unauthorized, got HTTP $status"
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            if ! grep -F '"error":"unauthorized"' "$body" >/dev/null; then
              echo "::error::$api_url$path did not return the expected unauthorized JSON payload"
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
          }

          assert_unauthenticated_json_route "/v1/soul/user"
          assert_unauthenticated_json_route "/v1/soul/organization"

          for forbidden in \
            "Den Control Plane Demo" \
            "Create account" \
            "POST /v1/workers" \
            "GET /v1/me" \
            "TestPass123!"; do
            if printf '%s\n' "$root_response" | grep -F "$forbidden" >/dev/null; then
              echo "::error::$api_url root still contains forbidden text: $forbidden"
              exit 1
            fi
          done

      - name: Install owned-server backup scheduler
        if: env.INSTALL_BACKUP_TIMER == 'true'
        run: |
          set -euo pipefail

          cd "$OWNED_SERVER_APP_DIR"

          compose() {
            sudo -n docker compose -f packaging/owned-server/compose.yml --env-file "$OWNED_SERVER_ENV_FILE" "$@"
          }

          for key in LETTR_API_KEY AUTH_EMAIL_ADDRESS AUTH_EMAIL_FROM_NAME; do
            if ! grep -Eq "^${key}=.+" "$OWNED_SERVER_ENV_FILE"; then
              echo "::error::Missing backup alert env value: $key"
              exit 1
            fi
          done

          if ! grep -Eq '^(BACKUP_ALERT_EMAIL_RECIPIENTS|AI_GATEWAY_ALERT_EMAIL_RECIPIENTS)=.+@.+' "$OWNED_SERVER_ENV_FILE"; then
            echo "::error::Missing backup alert recipients in owned-server env file"
            exit 1
          fi

          compose up -d backup
          compose ps backup

      - name: Run owned-server backup now
        if: env.RUN_BACKUP_NOW == 'true'
        run: |
          set -euo pipefail

          cd "$OWNED_SERVER_APP_DIR"

          compose() {
            sudo -n docker compose -f packaging/owned-server/compose.yml --env-file "$OWNED_SERVER_ENV_FILE" "$@"
          }

          compose run --rm --no-deps backup bash ./packaging/owned-server/backup/backup-owned-server-databases.sh
          compose run --rm --no-deps backup bash -lc '
            set -euo pipefail
            latest="$(find /srv/veslo/backups -mindepth 1 -maxdepth 1 -type d -name "????????T??????Z" -print | sort | tail -n 1)"
            test -n "$latest"
            cd "$latest"
            zstd -t den.sql.zst ai-gateway.sql.zst
            sha256sum -c den.sql.zst.sha256
            sha256sum -c ai-gateway.sql.zst.sha256
            printf "Latest backup: %s\n" "$latest"
            ls -lh den.sql.zst ai-gateway.sql.zst manifest.json
            cat manifest.json
          '
