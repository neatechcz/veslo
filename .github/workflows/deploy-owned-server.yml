name: Deploy Owned Server

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy. Leave empty to use the workflow ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-owned-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'neatechcz/veslo'
    env:
      OWNED_SERVER_HOST: ${{ vars.OWNED_SERVER_HOST || secrets.OWNED_SERVER_HOST || '62.109.146.43' }}
      OWNED_SERVER_USER: ${{ vars.OWNED_SERVER_USER || secrets.OWNED_SERVER_USER || 'neatech' }}
      OWNED_SERVER_SSH_KEY: ${{ secrets.OWNED_SERVER_SSH_KEY }}
      OWNED_SERVER_KNOWN_HOSTS: ${{ secrets.OWNED_SERVER_KNOWN_HOSTS }}
      OWNED_SERVER_APP_DIR: ${{ vars.OWNED_SERVER_APP_DIR || '/home/neatech/veslo-owned-server-production' }}
      OWNED_SERVER_ENV_FILE: ${{ vars.OWNED_SERVER_ENV_FILE || '/home/neatech/veslo-owned-server-dark-launch-inputs/env/production.env' }}
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      - name: Validate owned-server deploy configuration
        run: |
          set -euo pipefail

          missing=0
          for key in OWNED_SERVER_HOST OWNED_SERVER_USER OWNED_SERVER_SSH_KEY OWNED_SERVER_KNOWN_HOSTS OWNED_SERVER_APP_DIR OWNED_SERVER_ENV_FILE DEPLOY_BRANCH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required owned-server deployment value: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$OWNED_SERVER_SSH_KEY" > ~/.ssh/owned-server-deploy
          chmod 600 ~/.ssh/owned-server-deploy
          printf '%s\n' "$OWNED_SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Compose stack on owned server
        run: |
          set -euo pipefail

          quote() {
            printf '%q' "$1"
          }

          remote_env="DEPLOY_BRANCH=$(quote "$DEPLOY_BRANCH") APP_DIR=$(quote "$OWNED_SERVER_APP_DIR") ENV_FILE=$(quote "$OWNED_SERVER_ENV_FILE") REPO_URL=$(quote "$REPO_URL")"

          ssh -i ~/.ssh/owned-server-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$OWNED_SERVER_USER@$OWNED_SERVER_HOST" \
            "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch --prune origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git checkout --detach "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          test -f "$ENV_FILE"
          test -f packaging/owned-server/compose.yml

          compose() {
            sudo -n docker compose -f packaging/owned-server/compose.yml --env-file "$ENV_FILE" "$@"
          }

          compose config --quiet
          compose build worker-runtime-image worker-manager den ai-gateway web
          compose up -d den-db ai-gateway-db worker-manager
          compose run --rm --no-deps den pnpm --filter @neatech/den db:migrate
          compose run --rm --no-deps ai-gateway pnpm --filter @neatech/ai-gateway db:migrate
          compose up -d
          compose ps
          curl -fsS http://127.0.0.1:8790/health >/dev/null
          REMOTE

      - name: Verify public production endpoints
        run: |
          set -euo pipefail

          curl -fsS https://api.veslo.work/health
          curl -fsS https://ai.veslo.work/health
          curl -fsSI https://app.veslo.work >/dev/null

          root_response="$(curl -fsS https://api.veslo.work/)"
          printf '%s\n' "$root_response" | grep -F '"service":"veslo-den"' >/dev/null

          for forbidden in \
            "Den Control Plane Demo" \
            "Create account" \
            "POST /v1/workers" \
            "GET /v1/me" \
            "TestPass123!"; do
            if printf '%s\n' "$root_response" | grep -F "$forbidden" >/dev/null; then
              echo "::error::api.veslo.work root still contains forbidden text: $forbidden"
              exit 1
            fi
          done
