name: Build Staging App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Leave empty to use the workflow ref."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-staging-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-staging-release:
    name: Prepare staging prerelease
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.staging-release-meta.outputs.release_tag }}
      release_name: ${{ steps.staging-release-meta.outputs.release_name }}
      release_target: ${{ steps.staging-release-meta.outputs.release_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set staging prerelease metadata
        id: staging-release-meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          release_target=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          release_date=$(date -u +%Y-%m-%d)
          tag="staging-${release_date}-${short_sha}"
          name="Veslo Staging ${release_date} (${short_sha})"
          RELEASE_TAG="$tag"
          RELEASE_NAME="$name"
          RELEASE_TARGET="$release_target"

          body_file="$RUNNER_TEMP/staging_release_body.md"
          {
            printf 'Private staging prerelease from `%s` (`%s`).\n\n' "$REQUESTED_REF" "$release_target"
            printf -- '- Built by the manual Build Staging App workflow.\n'
            printf -- '- Staging endpoints are baked into the app.\n'
            printf -- '- macOS artifacts are signed with the Apple Developer ID certificate.\n'
            printf -- '- Updater publishing is disabled; this release is not mirrored to the public updater repository.\n'
          } > "$body_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$body_file" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_NAME" \
              --notes-file "$body_file" \
              --prerelease
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_target=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: Build staging app (${{ matrix.target }})
    needs: prepare-staging-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    environment: release-signing
    env:
      RELEASE_TAG: ${{ needs.prepare-staging-release.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.prepare-staging-release.outputs.release_name }}
      RELEASE_TARGET: ${{ needs.prepare-staging-release.outputs.release_target }}
      OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}
      TARGET_TRIPLE: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      TAURI_WINDOWS_RELEASE_CONFIG: src-tauri/tauri.windows.release.conf.json
      VESLO_WINDOWS_SIGNING_DESCRIPTION: Veslo Staging
      VESLO_WINDOWS_SIGNING_TIMEOUT_SECONDS: 900
      VESLO_WINDOWS_SIGNING_MAX_ATTEMPTS: 2
      VESLO_DEPLOYMENT_DOMAIN: ${{ vars.VESLO_STAGING_DEPLOYMENT_DOMAIN || 'staging.veslo.work' }}
      VITE_VESLO_DEPLOYMENT_DOMAIN: ${{ vars.VESLO_STAGING_DEPLOYMENT_DOMAIN || 'staging.veslo.work' }}
      VITE_VESLO_UPDATER_ENABLED: false
      VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VITE_VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VESLO_GLITCHTIP_ENVIRONMENT: staging
      VITE_VESLO_GLITCHTIP_ENVIRONMENT: staging
      VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}
      VITE_VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            os_type: macos
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: macos-14
            os_type: macos
            target: x86_64-apple-darwin
            bundles: dmg,app
          - platform: windows-2022
            os_type: windows
            target: x86_64-pc-windows-msvc
            bundles: msi

    steps:
      - name: Enable git long paths
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-staging-release.outputs.release_target }}

      - name: Resolve artifact commit
        id: artifact-meta
        shell: bash
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Review release packaging
        run: pnpm release:review --strict

      - name: Prepare desktop sidecars
        run: pnpm -C packages/desktop prepare:sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve Windows signing
        if: matrix.os_type == 'windows'
        id: signing
        shell: bash
        env:
          OS_TYPE: windows
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: node scripts/release/release-signing.mjs

      - name: Azure login
        if: matrix.os_type == 'windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Artifact Signing dlib package
        if: matrix.os_type == 'windows'
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/release/install-artifact-signing-client-tools.ps1

      - name: Write Artifact Signing metadata
        if: matrix.os_type == 'windows'
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'veslo-staging-artifact-signing-metadata.json'
          $metadata = @{
            Endpoint = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME
            CorrelationId = "${{ github.run_id }}-${{ github.job }}-staging"
          } | ConvertTo-Json -Depth 4

          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8NoBOM
          "VESLO_WINDOWS_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV

      - name: Resolve macOS staging signing
        if: matrix.os_type == 'macos'
        id: macos_signing
        shell: bash
        env:
          OS_TYPE: macos
          MACOS_NOTARIZE: false
          ALLOW_UNSIGNED_MACOS: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: node scripts/release/release-signing.mjs

      - name: Build macOS staging app
        if: matrix.os_type == 'macos'
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm --filter @neatech/veslo exec tauri build \
            --config src-tauri/tauri.staging.conf.json \
            --target "$TARGET_TRIPLE" \
            --bundles "$BUNDLES"

      - name: Sign and verify macOS staging assets
        if: matrix.os_type == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          app_path="packages/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/Veslo Staging.app"
          dmg_dir="packages/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle/dmg"
          app_signature="$RUNNER_TEMP/staging-app-codesign.txt"

          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | tee "$app_signature"
          grep -F "Authority=Developer ID Application:" "$app_signature"
          grep -F "TeamIdentifier=" "$app_signature"

          cert_path="$RUNNER_TEMP/apple-codesign.p12"
          keychain_path="$RUNNER_TEMP/veslo-staging-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$cert_path"
          }
          trap cleanup EXIT

          printf "%s" "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

          existing_keychains="$(security list-keychains -d user | tr -d ' "')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing_keychains

          test -d "$dmg_dir"
          dmg_count=0
          while IFS= read -r dmg_path; do
            dmg_count=$((dmg_count + 1))
            dmg_signature="$RUNNER_TEMP/$(basename "$dmg_path").codesign.txt"

            codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$dmg_path"
            codesign --verify --verbose=2 "$dmg_path"
            codesign -dv --verbose=4 "$dmg_path" 2>&1 | tee "$dmg_signature"
            grep -F "Authority=Developer ID Application:" "$dmg_signature"
            grep -F "TeamIdentifier=" "$dmg_signature"
          done < <(find "$dmg_dir" -type f -name '*.dmg' -print | sort)

          if [ "$dmg_count" -eq 0 ]; then
            echo "No macOS staging DMG found in $dmg_dir" >&2
            exit 1
          fi

      - name: Build Windows staging MSI
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: |
          pnpm --filter @neatech/veslo exec tauri build `
            --config src-tauri/tauri.staging.conf.json `
            --config src-tauri/tauri.windows.release.conf.json `
            --config src-tauri/tauri.windows.staging.conf.json `
            --target $env:TARGET_TRIPLE `
            --bundles msi

      - name: Resolve staging artifact path
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="packages/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bundle_dir="packages/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle/msi"
          fi
          test -d "$bundle_dir"
          find "$bundle_dir" -type f -print | sort
          echo "STAGING_ARTIFACT_PATH=$bundle_dir" >> "$GITHUB_ENV"

      - name: Upload staging app artifact
        uses: actions/upload-artifact@v4
        with:
          name: veslo-staging-${{ matrix.target }}-${{ steps.artifact-meta.outputs.sha }}
          path: ${{ env.STAGING_ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Collect staging release assets
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/staging-release-assets"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          while IFS= read -r file; do
            cp "$file" "$release_dir/$(basename "$file")"
          done < <(find "$STAGING_ARTIFACT_PATH" -type f \( -name '*.dmg' -o -name '*.msi' \) -print | sort)

          asset_count=$(find "$release_dir" -type f | wc -l | tr -d ' ')
          if [ "$asset_count" -eq 0 ]; then
            echo "No staging release assets found in $STAGING_ARTIFACT_PATH" >&2
            exit 1
          fi

          find "$release_dir" -type f -print | sort
          echo "STAGING_RELEASE_ASSET_PATH=$release_dir" >> "$GITHUB_ENV"

      - name: Upload staging assets to private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" "$STAGING_RELEASE_ASSET_PATH"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
