name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.2). Leave empty to use current ref."
        required: false
        type: string
      release_name:
        description: "Release title (defaults to Veslo <tag>)"
        required: false
        type: string
      release_body:
        description: "Release notes body in Markdown (defaults to a short placeholder)"
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false
      notarize:
        description: "Notarize macOS builds (requires Apple team configured)"
        required: false
        type: boolean
        default: false
      allow_unsigned_macos:
        description: "Allow unsigned macOS artifacts for internal test releases"
        required: false
        type: boolean
        default: false
      build_tauri:
        description: "Build desktop (Tauri) artifacts"
        required: false
        type: boolean
        default: true
      publish_sidecars:
        description: "Build + upload veslo-orchestrator sidecar release assets"
        required: false
        type: boolean
        default: true
      publish_npm:
        description: "Publish veslo-orchestrator/veslo-server/veslo-code-router to npm if versions changed"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-release:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_body: ${{ steps.resolve.outputs.release_body }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      notarize: ${{ steps.resolve.outputs.notarize }}
      allow_unsigned_macos: ${{ steps.resolve.outputs.allow_unsigned_macos }}
      build_tauri: ${{ steps.resolve.outputs.build_tauri }}
      publish_sidecars: ${{ steps.resolve.outputs.publish_sidecars }}
      publish_npm: ${{ steps.resolve.outputs.publish_npm }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve metadata
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_RELEASE_BODY: ${{ github.event.inputs.release_body }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_NOTARIZE: ${{ github.event.inputs.notarize }}
          INPUT_ALLOW_UNSIGNED_MACOS: ${{ github.event.inputs.allow_unsigned_macos }}
          INPUT_BUILD_TAURI: ${{ github.event.inputs.build_tauri }}
          INPUT_PUBLISH_SIDECARS: ${{ github.event.inputs.publish_sidecars }}
          INPUT_PUBLISH_NPM: ${{ github.event.inputs.publish_npm }}
          DEFAULT_PUBLISH_SIDECARS: ${{ vars.RELEASE_PUBLISH_SIDECARS }}
          DEFAULT_PUBLISH_NPM: ${{ vars.RELEASE_PUBLISH_NPM }}
          DEFAULT_NOTARIZE: ${{ vars.MACOS_NOTARIZE }}
          DEFAULT_ALLOW_UNSIGNED_MACOS: ${{ vars.RELEASE_ALLOW_UNSIGNED_MACOS }}
          DEFAULT_BUILD_TAURI: ${{ vars.RELEASE_BUILD_TAURI }}
        run: |
          set -euo pipefail

          TAG_INPUT="${INPUT_TAG:-}"
          if [ -n "$TAG_INPUT" ]; then
            if [[ "$TAG_INPUT" == v* ]]; then
              TAG="$TAG_INPUT"
            else
              TAG="v$TAG_INPUT"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG (expected CalVer vYYYY.M.P)" >&2
            exit 1
          fi

          RELEASE_NAME_INPUT="${INPUT_RELEASE_NAME:-}"
          if [ -n "$RELEASE_NAME_INPUT" ]; then
            RELEASE_NAME="$RELEASE_NAME_INPUT"
          else
            RELEASE_NAME="Veslo $TAG"
          fi

          RELEASE_BODY_INPUT="${INPUT_RELEASE_BODY:-}"
          if [ -n "$RELEASE_BODY_INPUT" ]; then
            RELEASE_BODY="$RELEASE_BODY_INPUT"
          elif [ -f "release-notes/$TAG.md" ]; then
            RELEASE_BODY="$(cat "release-notes/$TAG.md")"
          else
            RELEASE_BODY="See the assets to download this version and install."
          fi

          draft="${INPUT_DRAFT:-}"
          if [ -z "$draft" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              # Keep tag-triggered releases out of /releases/latest until assets + latest.json are ready.
              draft="true"
            else
              draft="false"
            fi
          fi
          prerelease="${INPUT_PRERELEASE:-false}"
          notarize="${INPUT_NOTARIZE:-}"
          if [ -z "$notarize" ]; then
            notarize="${DEFAULT_NOTARIZE:-true}"
          fi
          allow_unsigned_macos="${INPUT_ALLOW_UNSIGNED_MACOS:-}"
          if [ -z "$allow_unsigned_macos" ]; then
            allow_unsigned_macos="${DEFAULT_ALLOW_UNSIGNED_MACOS:-false}"
          fi

          build_tauri="${INPUT_BUILD_TAURI:-}"
          if [ -z "$build_tauri" ]; then
            build_tauri="${DEFAULT_BUILD_TAURI:-true}"
          fi

          publish_sidecars="${INPUT_PUBLISH_SIDECARS:-}"
          if [ -z "$publish_sidecars" ]; then
            publish_sidecars="${DEFAULT_PUBLISH_SIDECARS:-true}"
          fi
          publish_npm="${INPUT_PUBLISH_NPM:-}"
          if [ -z "$publish_npm" ]; then
            publish_npm="${DEFAULT_PUBLISH_NPM:-true}"
          fi

          TAG="${TAG//$'\n'/}"
          TAG="${TAG//$'\r'/}"
          RELEASE_NAME="${RELEASE_NAME//$'\n'/ }"
          RELEASE_NAME="${RELEASE_NAME//$'\r'/ }"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "allow_unsigned_macos=$allow_unsigned_macos" >> "$GITHUB_OUTPUT"
          echo "build_tauri=$build_tauri" >> "$GITHUB_OUTPUT"
          echo "publish_sidecars=$publish_sidecars" >> "$GITHUB_OUTPUT"
          echo "publish_npm=$publish_npm" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<__VESLO_RELEASE_BODY_EOF__"
            printf '%s\n' "$RELEASE_BODY"
            echo "__VESLO_RELEASE_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BODY_FILE="$RUNNER_TEMP/release_body.md"
          printf '%s\n' "${{ steps.resolve.outputs.release_body }}" > "$BODY_FILE"

          if gh release view "${{ steps.resolve.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.resolve.outputs.release_tag }} already exists; skipping create."
            exit 0
          fi

          DRAFT_FLAG=""
          PRERELEASE_FLAG=""
          if [ "${{ steps.resolve.outputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          if [ "${{ steps.resolve.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.resolve.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.resolve.outputs.release_name }}" \
            --notes-file "$BODY_FILE" \
            $DRAFT_FLAG $PRERELEASE_FLAG

  verify-release:
    name: Verify Release Versions
    needs: resolve-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches app versions
        run: node scripts/release/verify-tag.mjs --tag "$RELEASE_TAG"

      - name: Release review (strict)
        run: node scripts/release/review.mjs --strict

      - name: Verify document runtime packages
        run: node scripts/release/verify-document-runtime-packages.mjs --profile local-docs-required --json

  publish-tauri:
    name: Build + Publish (${{ matrix.target }})
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.build_tauri == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.resolve-release.outputs.release_name }}
      RELEASE_BODY: ${{ needs.resolve-release.outputs.release_body }}
      RELEASE_DRAFT: ${{ needs.resolve-release.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      MACOS_NOTARIZE: ${{ needs.resolve-release.outputs.notarize }}
      ALLOW_UNSIGNED_MACOS: ${{ needs.resolve-release.outputs.allow_unsigned_macos }}
      # Ensure Tauri's beforeBuildCommand (prepare:sidecar) uses our fork.
      OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}
      VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VITE_VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VESLO_GLITCHTIP_ENVIRONMENT: production
      VITE_VESLO_GLITCHTIP_ENVIRONMENT: production
      VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}
      VITE_VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}
      VESLO_REQUIRE_GLITCHTIP_RELEASE_ENV: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            os_type: macos
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg,app"
          - platform: macos-14
            os_type: macos
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg,app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify GlitchTip release monitoring env
        shell: bash
        run: node scripts/release/verify-glitchtip-release-env.mjs

      - name: Install OpenTUI x64 core (macOS x86_64)
        if: matrix.os_type == 'macos' && matrix.target == 'x86_64-apple-darwin'
        run: pnpm add -w --ignore-workspace-root-check @opentui/core-darwin-x64@0.1.77

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve OpenCode version
        id: opencode-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const repo = (process.env.OPENCODE_GITHUB_REPO || 'anomalyco/opencode').trim() || 'anomalyco/opencode';

          async function resolveLatest() {
            const token = (process.env.GITHUB_TOKEN || '').trim();
            const headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'veslo-ci',
            };
            if (token) headers.Authorization = `Bearer ${token}`;

            // Prefer API, but fall back to the web "latest" redirect if rate-limited (403) or otherwise blocked.
            try {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, { headers });
              if (res.ok) {
                const data = await res.json();
                const tag = (typeof data.tag_name === 'string' ? data.tag_name : '').trim();
                let v = tag.startsWith('v') ? tag.slice(1) : tag;
                v = v.trim();
                if (v) return v;
              }
              if (res.status !== 403) {
                throw new Error(`Failed to resolve latest OpenCode version (HTTP ${res.status})`);
              }
            } catch {
              // continue to fallback
            }

            const web = await fetch(`https://github.com/${repo}/releases/latest`, {
              headers: { 'User-Agent': 'veslo-ci' },
              redirect: 'follow',
            });
            const url = (web && web.url) ? String(web.url) : '';
            const match = url.match(/\/tag\/v([^/?#]+)/);
            if (!match) throw new Error('Failed to resolve latest OpenCode version (web redirect).');
            return match[1];
          }

          async function main() {
            const pkg = JSON.parse(fs.readFileSync('./packages/desktop/package.json', 'utf8'));
            const configuredRaw = (process.env.OPENCODE_VERSION || pkg.opencodeVersion || '').toString().trim();
            if (configuredRaw && configuredRaw.toLowerCase() !== 'latest') {
              const normalized = configuredRaw.startsWith('v') ? configuredRaw.slice(1) : configuredRaw;
              const resolved = normalized.trim();
              if (process.env.GITHUB_ENV) {
                fs.appendFileSync(process.env.GITHUB_ENV, `OPENCODE_VERSION=${resolved}\n`);
              }
              console.log('version=' + resolved);
              return;
            }
            const latest = await resolveLatest();
            if (process.env.GITHUB_ENV) {
              fs.appendFileSync(process.env.GITHUB_ENV, `OPENCODE_VERSION=${latest}\n`);
            }
            console.log('version=' + latest);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Download OpenCode sidecar
        shell: bash
        env:
          OPENCODE_VERSION: ${{ steps.opencode-version.outputs.version }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              opencode_asset="opencode-darwin-arm64.zip"
              ;;
            x86_64-apple-darwin)
              opencode_asset="opencode-darwin-x64-baseline.zip"
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          repo="${OPENCODE_GITHUB_REPO:-anomalyco/opencode}"
          url="https://github.com/${repo}/releases/download/v${OPENCODE_VERSION}/${opencode_asset}"
          tmp_dir="$RUNNER_TEMP/opencode"
          extract_dir="$tmp_dir/extracted"
          rm -rf "$tmp_dir"
          mkdir -p "$extract_dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp_dir/$opencode_asset" "$url"

          if [[ "$opencode_asset" == *.tar.gz ]]; then
            tar -xzf "$tmp_dir/$opencode_asset" -C "$extract_dir"
          else
            if command -v unzip >/dev/null 2>&1; then
              unzip -q "$tmp_dir/$opencode_asset" -d "$extract_dir"
            elif command -v 7z >/dev/null 2>&1; then
              7z x "$tmp_dir/$opencode_asset" -o"$extract_dir" >/dev/null
            else
              echo "No unzip utility available" >&2
              exit 1
            fi
          fi

          if [ -f "$extract_dir/opencode" ]; then
            bin_path="$extract_dir/opencode"
          elif [ -f "$extract_dir/opencode.exe" ]; then
            bin_path="$extract_dir/opencode.exe"
          else
            echo "OpenCode binary not found in archive" >&2
            ls -la "$extract_dir"
            exit 1
          fi

          target_name="opencode-${{ matrix.target }}"
          if [ "${{ matrix.os_type }}" = "windows" ]; then
            target_name="${target_name}.exe"
          fi

          mkdir -p packages/desktop/src-tauri/sidecars
          cp "$bin_path" "packages/desktop/src-tauri/sidecars/${target_name}"
          chmod 755 "packages/desktop/src-tauri/sidecars/${target_name}"

      - name: Resolve release signing
        id: signing
        shell: bash
        env:
          OS_TYPE: ${{ matrix.os_type }}
          MACOS_NOTARIZE: ${{ env.MACOS_NOTARIZE }}
          ALLOW_UNSIGNED_MACOS: ${{ env.ALLOW_UNSIGNED_MACOS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: node scripts/release/release-signing.mjs

      - name: Write notary API key
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldNotarizeMacos == 'true' && steps.signing.outputs.appleNotaryAuthMode == 'api-key'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate notary API key
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldNotarizeMacos == 'true' && steps.signing.outputs.appleNotaryAuthMode == 'api-key'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null
          echo "Notary API key authenticated."

      - name: Build signed macOS bundle for notarization
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldNotarizeMacos == 'true'
        shell: bash
        timeout-minutes: 35
        env:
          CI: true

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          cd packages/desktop
          pnpm exec tauri -vvv build ${{ matrix.args }}

      - name: Notarize, staple, and re-sign macOS assets
        id: macos_assets
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldNotarizeMacos == 'true'
        shell: bash
        timeout-minutes: 40
        env:
          VESLO_MACOS_TARGET_TRIPLE: ${{ matrix.target }}
          VESLO_NOTARY_AUTH_MODE: ${{ steps.signing.outputs.appleNotaryAuthMode }}
          VESLO_NOTARY_TIMEOUT: 30m
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize-macos-assets.sh

      - name: Upload notarized macOS release assets
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldNotarizeMacos == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_arch="${{ steps.macos_assets.outputs.asset_arch }}"
          asset_dir="$RUNNER_TEMP/veslo-macos-release-assets"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"

          app_tar_asset_path="$asset_dir/veslo-desktop-darwin-${asset_arch}.app.tar.gz"
          app_tar_sig_asset_path="$asset_dir/veslo-desktop-darwin-${asset_arch}.app.tar.gz.sig"
          dmg_asset_path="$asset_dir/veslo-desktop-darwin-${asset_arch}.dmg"

          cp "${{ steps.macos_assets.outputs.app_tar_path }}" "$app_tar_asset_path"
          cp "${{ steps.macos_assets.outputs.app_tar_sig_path }}" "$app_tar_sig_asset_path"
          cp "${{ steps.macos_assets.outputs.dmg_path }}" "$dmg_asset_path"

          gh release upload "$RELEASE_TAG" \
            "$app_tar_asset_path" \
            "$app_tar_sig_asset_path" \
            "$dmg_asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Build + upload (signed macOS)
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldBuildSignedMacos == 'true' && steps.signing.outputs.shouldNotarizeMacos != 'true'
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: ${{ env.RELEASE_DRAFT == 'true' }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          projectPath: packages/desktop
          tauriScript: pnpm exec tauri -vvv
          args: ${{ matrix.args }}
          retryAttempts: 3
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: veslo-desktop-[platform]-[arch][ext]

      - name: Build + upload (unsigned macOS)
        if: matrix.os_type == 'macos' && steps.signing.outputs.shouldBuildUnsignedMacos == 'true'
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: ${{ env.RELEASE_DRAFT == 'true' }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          projectPath: packages/desktop
          tauriScript: pnpm exec tauri -vvv
          args: ${{ matrix.args }}
          retryAttempts: 3
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: veslo-desktop-[platform]-[arch][ext]

      - name: Verify versions.json bundled (macOS)
        if: success() && matrix.os_type == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              asset_arch="aarch64"
              ;;
            x86_64-apple-darwin)
              asset_arch="x64"
              ;;
            *)
              echo "Unexpected target for macOS verify: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          tmp_dir="$RUNNER_TEMP/veslo-bundle-verify"
          rm -rf "$tmp_dir"
          mkdir -p "$tmp_dir"

          gh release download "${RELEASE_TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "veslo-desktop-darwin-${asset_arch}.app.tar.gz" \
            --dir "$tmp_dir"

          tar -xzf "$tmp_dir/veslo-desktop-darwin-${asset_arch}.app.tar.gz" -C "$tmp_dir"
          node scripts/release/verify-bundled-versions.mjs "$tmp_dir" "${{ matrix.target }}"

  publish-tauri-windows:
    name: Build + Publish (x86_64-pc-windows-msvc)
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.build_tauri == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.resolve-release.outputs.release_name }}
      RELEASE_BODY: ${{ needs.resolve-release.outputs.release_body }}
      RELEASE_DRAFT: ${{ needs.resolve-release.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}
      TARGET_TRIPLE: x86_64-pc-windows-msvc
      TAURI_WINDOWS_RELEASE_CONFIG: src-tauri/tauri.windows.release.conf.json
      VESLO_WINDOWS_SIGNING_DESCRIPTION: Veslo by Neatech
      VESLO_WINDOWS_SIGNING_TIMEOUT_SECONDS: 1800
      VESLO_WINDOWS_SIGNING_MAX_ATTEMPTS: 3
      VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VITE_VESLO_GLITCHTIP_DSN: ${{ vars.VESLO_GLITCHTIP_DSN }}
      VESLO_GLITCHTIP_ENVIRONMENT: production
      VITE_VESLO_GLITCHTIP_ENVIRONMENT: production
      VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}
      VITE_VESLO_GLITCHTIP_TRACES_SAMPLE_RATE: ${{ vars.VESLO_GLITCHTIP_TRACES_SAMPLE_RATE || '0' }}
      VESLO_REQUIRE_GLITCHTIP_RELEASE_ENV: "1"
    steps:
      - name: Enable git long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify GlitchTip release monitoring env
        shell: pwsh
        run: node scripts/release/verify-glitchtip-release-env.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_TRIPLE }}

      - name: Resolve OpenCode version
        id: opencode-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const repo = (process.env.OPENCODE_GITHUB_REPO || 'anomalyco/opencode').trim() || 'anomalyco/opencode';

          async function resolveLatest() {
            const token = (process.env.GITHUB_TOKEN || '').trim();
            const headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'veslo-ci',
            };
            if (token) headers.Authorization = `Bearer ${token}`;

            try {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, { headers });
              if (res.ok) {
                const data = await res.json();
                const tag = (typeof data.tag_name === 'string' ? data.tag_name : '').trim();
                let v = tag.startsWith('v') ? tag.slice(1) : tag;
                v = v.trim();
                if (v) return v;
              }
              if (res.status !== 403) {
                throw new Error(`Failed to resolve latest OpenCode version (HTTP ${res.status})`);
              }
            } catch {
              // continue to fallback
            }

            const web = await fetch(`https://github.com/${repo}/releases/latest`, {
              headers: { 'User-Agent': 'veslo-ci' },
              redirect: 'follow',
            });
            const url = (web && web.url) ? String(web.url) : '';
            const match = url.match(/\/tag\/v([^/?#]+)/);
            if (!match) throw new Error('Failed to resolve latest OpenCode version (web redirect).');
            return match[1];
          }

          async function main() {
            const pkg = JSON.parse(fs.readFileSync('./packages/desktop/package.json', 'utf8'));
            const configuredRaw = (process.env.OPENCODE_VERSION || pkg.opencodeVersion || '').toString().trim();
            if (configuredRaw && configuredRaw.toLowerCase() !== 'latest') {
              const normalized = configuredRaw.startsWith('v') ? configuredRaw.slice(1) : configuredRaw;
              const resolved = normalized.trim();
              if (process.env.GITHUB_ENV) {
                fs.appendFileSync(process.env.GITHUB_ENV, `OPENCODE_VERSION=${resolved}\n`);
              }
              console.log('version=' + resolved);
              return;
            }
            const latest = await resolveLatest();
            if (process.env.GITHUB_ENV) {
              fs.appendFileSync(process.env.GITHUB_ENV, `OPENCODE_VERSION=${latest}\n`);
            }
            console.log('version=' + latest);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Download OpenCode sidecar
        shell: bash
        env:
          OPENCODE_VERSION: ${{ steps.opencode-version.outputs.version }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail

          opencode_asset="opencode-windows-x64-baseline.zip"
          repo="${OPENCODE_GITHUB_REPO:-anomalyco/opencode}"
          url="https://github.com/${repo}/releases/download/v${OPENCODE_VERSION}/${opencode_asset}"
          tmp_dir="$RUNNER_TEMP/opencode"
          extract_dir="$tmp_dir/extracted"
          rm -rf "$tmp_dir"
          mkdir -p "$extract_dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp_dir/$opencode_asset" "$url"

          if command -v unzip >/dev/null 2>&1; then
            unzip -q "$tmp_dir/$opencode_asset" -d "$extract_dir"
          elif command -v 7z >/dev/null 2>&1; then
            7z x "$tmp_dir/$opencode_asset" -o"$extract_dir" >/dev/null
          else
            echo "No unzip utility available" >&2
            exit 1
          fi

          if [ -f "$extract_dir/opencode.exe" ]; then
            bin_path="$extract_dir/opencode.exe"
          else
            echo "OpenCode binary not found in archive" >&2
            ls -la "$extract_dir"
            exit 1
          fi

          mkdir -p packages/desktop/src-tauri/sidecars
          cp "$bin_path" "packages/desktop/src-tauri/sidecars/opencode-${TARGET_TRIPLE}.exe"
          chmod 755 "packages/desktop/src-tauri/sidecars/opencode-${TARGET_TRIPLE}.exe"

      - name: Resolve release signing
        id: signing
        shell: bash
        env:
          OS_TYPE: windows
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: node scripts/release/release-signing.mjs

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure CLI session
        shell: pwsh
        run: az account show

      - name: Install Artifact Signing dlib package
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/release/install-artifact-signing-client-tools.ps1

      - name: Write Artifact Signing metadata
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'veslo-artifact-signing-metadata.json'
          $metadata = @{
            Endpoint = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME
            CorrelationId = "${{ github.run_id }}-${{ github.job }}"
          } | ConvertTo-Json -Depth 4

          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8NoBOM
          "VESLO_WINDOWS_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV

      - name: Build Windows bundle
        shell: pwsh
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Push-Location packages/desktop
          pnpm exec tauri -vvv build --config $env:TAURI_WINDOWS_RELEASE_CONFIG --target $env:TARGET_TRIPLE --bundles msi
          Pop-Location

      - name: Resolve Windows bundle paths
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'packages\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi'
          if (-not (Test-Path $bundleDir)) {
            throw "Windows bundle directory not found: $bundleDir"
          }

          $msi = Get-ChildItem -Path $bundleDir -Filter '*.msi' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $msiSig = Get-ChildItem -Path $bundleDir -Filter '*.msi.sig' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $appExe = Join-Path $env:GITHUB_WORKSPACE 'packages\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\veslo.exe'

          if (-not $msi) {
            throw "No MSI bundle found in $bundleDir"
          }
          if (-not $msiSig) {
            throw "No MSI updater signature found in $bundleDir"
          }
          if (-not (Test-Path $appExe)) {
            throw "Signed Windows app executable not found at $appExe"
          }

          "VESLO_WINDOWS_MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV
          "VESLO_WINDOWS_MSI_SIG_PATH=$($msiSig.FullName)" >> $env:GITHUB_ENV
          "VESLO_WINDOWS_APP_EXE_PATH=$appExe" >> $env:GITHUB_ENV

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = @(
            $env:VESLO_WINDOWS_APP_EXE_PATH,
            $env:VESLO_WINDOWS_MSI_PATH
          )

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') {
              $signature | Format-List * | Out-String | Write-Host
              throw "Authenticode signature is not valid for $file"
            }

            Write-Host "Valid signature for $file"
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          }

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'veslo-windows-release-assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $msiAssetPath = Join-Path $assetDir 'veslo-desktop-windows-x64.msi'
          $msiSigAssetPath = Join-Path $assetDir 'veslo-desktop-windows-x64.msi.sig'
          Copy-Item -Force -Path $env:VESLO_WINDOWS_MSI_PATH -Destination $msiAssetPath
          Copy-Item -Force -Path $env:VESLO_WINDOWS_MSI_SIG_PATH -Destination $msiSigAssetPath

          $existingAssets = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          $assetNamesToDelete = @(
            'veslo-desktop-windows-x64.msi',
            'veslo-desktop-windows-x64.msi.sig',
            (Split-Path -Leaf $env:VESLO_WINDOWS_MSI_PATH),
            (Split-Path -Leaf $env:VESLO_WINDOWS_MSI_SIG_PATH)
          ) | Select-Object -Unique

          foreach ($assetName in $assetNamesToDelete) {
            $asset = $existingAssets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) {
              continue
            }

            $apiPath = $asset.apiUrl -replace '^https://api.github.com/', ''
            gh api -X DELETE $apiPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing release asset: $assetName"
            }
          }

          gh release upload $env:RELEASE_TAG `
            $msiAssetPath `
            $msiSigAssetPath `
            --repo $env:GITHUB_REPOSITORY

  mirror-public-release:
    name: Mirror desktop release to public repo
    needs: [resolve-release, verify-release, publish-tauri, publish-tauri-windows]
    if: needs.resolve-release.outputs.build_tauri == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.resolve-release.outputs.release_name }}
      RELEASE_BODY: ${{ needs.resolve-release.outputs.release_body }}
      RELEASE_DRAFT: ${{ needs.resolve-release.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      PUBLIC_RELEASE_REPO: ${{ vars.RELEASE_UPDATES_REPO || vars.VESLO_UPDATES_REPO || 'neatechcz/veslo-updates' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Mirror public desktop assets
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          TARGET_GH_TOKEN: ${{ secrets.RELEASE_UPDATES_GH_TOKEN || secrets.VESLO_UPDATES_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_GH_TOKEN:-}" ]; then
            echo "RELEASE_UPDATES_GH_TOKEN is required to publish the public desktop release." >&2
            exit 1
          fi

          node scripts/release/mirror-public-release.mjs \
            --source-repo "$GITHUB_REPOSITORY" \
            --target-repo "$PUBLIC_RELEASE_REPO" \
            --tag "$RELEASE_TAG" \
            --release-name "$RELEASE_NAME" \
            --release-body "$RELEASE_BODY" \
            --draft "$RELEASE_DRAFT" \
            --prerelease "$RELEASE_PRERELEASE"

  publish-updater-json:
    name: Publish public latest.json
    needs: [resolve-release, verify-release, mirror-public-release]
    if: needs.resolve-release.outputs.build_tauri == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      PUBLIC_RELEASE_REPO: ${{ vars.RELEASE_UPDATES_REPO || vars.VESLO_UPDATES_REPO || 'neatechcz/veslo-updates' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_UPDATES_GH_TOKEN || secrets.VESLO_UPDATES_GH_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/generate-latest-json.mjs \
            --tag "$RELEASE_TAG" \
            --repo "$PUBLIC_RELEASE_REPO" \
            --output "$RUNNER_TEMP/latest.json"

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_UPDATES_GH_TOKEN || secrets.VESLO_UPDATES_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json#latest.json" \
            --repo "$PUBLIC_RELEASE_REPO" \
            --clobber

  publish-public-release:
    name: Publish public desktop release
    needs:
      - resolve-release
      - verify-release
      - mirror-public-release
      - publish-updater-json
      - publish-tauri-windows
    if: |
      always() &&
      needs.resolve-release.outputs.build_tauri == 'true' &&
      needs.resolve-release.result == 'success' &&
      needs.verify-release.result == 'success' &&
      needs.publish-tauri-windows.result == 'success' &&
      needs.mirror-public-release.result == 'success' &&
      needs.publish-updater-json.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      PUBLIC_RELEASE_REPO: ${{ vars.RELEASE_UPDATES_REPO || vars.VESLO_UPDATES_REPO || 'neatechcz/veslo-updates' }}
    steps:
      - name: Publish public release after assets are ready
        env:
          GH_TOKEN: ${{ secrets.RELEASE_UPDATES_GH_TOKEN || secrets.VESLO_UPDATES_GH_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" --draft=false --latest
          fi

  release-orchestrator-sidecars:
    name: Build + Upload veslo-orchestrator Sidecars
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.publish_sidecars == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ubuntu-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve sidecar versions
        id: sidecar-versions
        shell: bash
        run: |
          node -e "const fs=require('fs'); const orchestrator=JSON.parse(fs.readFileSync('packages/orchestrator/package.json','utf8')); const server=JSON.parse(fs.readFileSync('packages/server/package.json','utf8')); const opencodeRouter=JSON.parse(fs.readFileSync('packages/opencode-router/package.json','utf8')); console.log('orchestrator=' + orchestrator.version); console.log('server=' + server.version); console.log('opencodeRouter=' + opencodeRouter.version);" >> "$GITHUB_OUTPUT"

      - name: Resolve SOURCE_DATE_EPOCH
        id: source-date
        shell: bash
        run: |
          epoch=$(git show -s --format=%ct "${RELEASE_TAG}")
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      - name: Check veslo-orchestrator release
        id: orchestrator-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="veslo-orchestrator-v${{ steps.sidecar-versions.outputs.orchestrator }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sidecar artifacts
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}
        run: pnpm --filter veslo-orchestrator build:sidecars

      - name: Release review (strict)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}
        run: node scripts/release/review.mjs --strict

      - name: Create veslo-orchestrator release
        if: steps.orchestrator-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.sidecar-versions.outputs.orchestrator }}"
          tag="veslo-orchestrator-v${version}"
          notes="Sidecar bundle for veslo-orchestrator v${version}.\n\nveslo-server: ${{ steps.sidecar-versions.outputs.server }}\nveslo-code-router: ${{ steps.sidecar-versions.outputs.opencodeRouter }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "veslo-orchestrator v${version}" \
            --notes "$notes" \
            --latest=false

      - name: Upload sidecar assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="veslo-orchestrator-v${{ steps.sidecar-versions.outputs.orchestrator }}"
          gh release upload "$tag" packages/orchestrator/dist/sidecars/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    name: Publish npm packages
    needs: [resolve-release, verify-release, release-orchestrator-sidecars]
    if: |
      always() &&
      needs.resolve-release.result == 'success' &&
      needs.verify-release.result == 'success' &&
      (needs.release-orchestrator-sidecars.result == 'success' || needs.release-orchestrator-sidecars.result == 'skipped') &&
      needs.resolve-release.outputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ubuntu-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve package versions
        id: package-versions
        shell: bash
        run: |
          node -e "const fs=require('fs'); const orchestrator=JSON.parse(fs.readFileSync('packages/orchestrator/package.json','utf8')); const server=JSON.parse(fs.readFileSync('packages/server/package.json','utf8')); const opencodeRouter=JSON.parse(fs.readFileSync('packages/opencode-router/package.json','utf8')); console.log('orchestrator=' + orchestrator.version); console.log('server=' + server.version); console.log('opencodeRouter=' + opencodeRouter.version);" >> "$GITHUB_OUTPUT"

      - name: Check npm versions
        id: npm-versions
        shell: bash
        env:
          ORCHESTRATOR_VERSION: ${{ steps.package-versions.outputs.orchestrator }}
          SERVER_VERSION: ${{ steps.package-versions.outputs.server }}
          OPENCODE_ROUTER_VERSION: ${{ steps.package-versions.outputs.opencodeRouter }}
        run: |
          set -euo pipefail
          # npm view exits non-zero for packages that don't exist yet (404).
          # Treat missing packages as "not published" so release can publish them.
          orchestrator_current="$(npm view veslo-orchestrator version 2>/dev/null || true)"
          server_current="$(npm view veslo-server version 2>/dev/null || true)"
          opencodeRouter_current="$(npm view veslo-code-router version 2>/dev/null || true)"

          if [ "$orchestrator_current" = "$ORCHESTRATOR_VERSION" ]; then
            echo "publish_orchestrator=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_orchestrator=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$server_current" = "$SERVER_VERSION" ]; then
            echo "publish_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_server=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$opencodeRouter_current" = "$OPENCODE_ROUTER_VERSION" ]; then
            echo "publish_opencodeRouter=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_opencodeRouter=true" >> "$GITHUB_OUTPUT"
          fi

          publish_any=false
          if [ "$orchestrator_current" != "$ORCHESTRATOR_VERSION" ] || [ "$server_current" != "$SERVER_VERSION" ] || [ "$opencodeRouter_current" != "$OPENCODE_ROUTER_VERSION" ]; then
            publish_any=true
          fi
          echo "publish_any=$publish_any" >> "$GITHUB_OUTPUT"

      - name: Ensure npm auth
        id: npm-auth
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_ANY: ${{ steps.npm-versions.outputs.publish_any }}
        run: |
          set -euo pipefail

          if [ "${PUBLISH_ANY}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set; skipping npm publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Publish veslo-server
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-versions.outputs.publish_server == 'true'
        run: pnpm --filter veslo-server publish --access public --no-git-checks

      - name: Publish veslo-code-router
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-versions.outputs.publish_opencodeRouter == 'true'
        run: pnpm --filter veslo-code-router publish --access public --no-git-checks

      - name: Publish veslo-orchestrator
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-versions.outputs.publish_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_VERSION: ${{ steps.package-versions.outputs.orchestrator }}
        run: |
          set -euo pipefail
          tag="veslo-orchestrator-v${ORCHESTRATOR_VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "veslo-orchestrator sidecar release $tag not found. Publish sidecars before veslo-orchestrator." >&2
            exit 1
          fi
          pnpm --filter veslo-orchestrator build:bin:all
          node packages/orchestrator/scripts/publish-npm.mjs

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-release
      - verify-release
      - publish-tauri
      - mirror-public-release
      - publish-updater-json
      - publish-public-release
      - release-orchestrator-sidecars
      - publish-npm
    if: |
      always() &&
      needs.resolve-release.outputs.draft == 'true' &&
      needs.resolve-release.result == 'success' &&
      needs.verify-release.result == 'success' &&
      (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'skipped') &&
      (needs.mirror-public-release.result == 'success' || needs.mirror-public-release.result == 'skipped') &&
      (needs.publish-updater-json.result == 'success' || needs.publish-updater-json.result == 'skipped') &&
      (needs.publish-public-release.result == 'success' || needs.publish-public-release.result == 'skipped') &&
      (needs.release-orchestrator-sidecars.result == 'success' || needs.release-orchestrator-sidecars.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
    steps:
      - name: Publish release after assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
