name: Windows Signing Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dlib-probe:
    name: Dlib probe (${{ matrix.auth_mode }})
    runs-on: windows-2022
    timeout-minutes: 10
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        auth_mode: [default-chain, azure-cli-only]
    env:
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
      VESLO_SIGNING_PROBE_PATH: ${{ github.workspace }}\SigningProbe-${{ matrix.auth_mode }}.exe
      VESLO_WINDOWS_SIGNING_DESCRIPTION: Veslo signing diagnostic
      VESLO_WINDOWS_SIGNING_TIMEOUT_SECONDS: "120"
      VESLO_WINDOWS_SIGNING_MAX_ATTEMPTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Probe network and Azure CLI token
        shell: pwsh
        run: |
          $endpoint = [Uri]$env:AZURE_ARTIFACT_SIGNING_ENDPOINT
          Resolve-DnsName -Name $endpoint.Host -Type A | Format-Table -AutoSize

          $network = Test-NetConnection -ComputerName $endpoint.Host -Port 443 -InformationLevel Detailed
          if (-not $network.TcpTestSucceeded) {
            throw "TCP connectivity failed for $($endpoint.Host):443"
          }
          Write-Host "TCP connect succeeded: remote=$($network.RemoteAddress)"

          $httpProbe = curl.exe -sS -o NUL -w "status=%{http_code} connect=%{time_connect}s total=%{time_total}s" --max-time 20 $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
          if ($LASTEXITCODE -ne 0) {
            throw "Artifact Signing endpoint probe failed with exit code $LASTEXITCODE"
          }
          Write-Host "Endpoint response: $httpProbe"

          $tokenTimer = [System.Diagnostics.Stopwatch]::StartNew()
          $tokenInfo = az account get-access-token --resource https://codesigning.azure.net --query '{expiresOn:expiresOn,subscription:subscription,tenant:tenant,tokenType:tokenType}' -o json
          $tokenTimer.Stop()
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI token acquisition failed with exit code $LASTEXITCODE"
          }
          Write-Host "Azure CLI token acquired in $($tokenTimer.ElapsedMilliseconds) ms"
          Write-Host $tokenInfo

      - name: Create unsigned signing probe
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "signing-probe-${{ matrix.auth_mode }}"
          $publishRoot = Join-Path $probeRoot "publish"
          dotnet new console --name SigningProbe --output $probeRoot --framework net8.0 --force
          Set-Content -Path (Join-Path $probeRoot "Program.cs") -Value 'Console.WriteLine("Veslo signing probe");' -Encoding utf8NoBOM
          dotnet publish (Join-Path $probeRoot "SigningProbe.csproj") --configuration Release --runtime win-x64 --self-contained false --output $publishRoot -p:UseAppHost=true
          Copy-Item -Path (Join-Path $publishRoot "SigningProbe.exe") -Destination $env:VESLO_SIGNING_PROBE_PATH -Force
          if (-not (Test-Path $env:VESLO_SIGNING_PROBE_PATH)) {
            throw "Signing probe was not created"
          }

          $signature = Get-AuthenticodeSignature -FilePath $env:VESLO_SIGNING_PROBE_PATH
          Write-Host "Initial signature status: $($signature.Status)"
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned probe, got $($signature.Status)"
          }

      - name: Install Artifact Signing dlib package
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/release/install-artifact-signing-client-tools.ps1

      - name: Write Artifact Signing metadata
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "veslo-signing-${{ matrix.auth_mode }}.json"
          $metadata = [ordered]@{
            Endpoint = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME
            CorrelationId = "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.auth_mode }}"
          }

          if ("${{ matrix.auth_mode }}" -eq "azure-cli-only") {
            $metadata.ExcludeCredentials = @(
              "EnvironmentCredential"
              "WorkloadIdentityCredential"
              "ManagedIdentityCredential"
              "SharedTokenCacheCredential"
              "VisualStudioCredential"
              "VisualStudioCodeCredential"
              "AzurePowerShellCredential"
              "AzureDeveloperCliCredential"
              "InteractiveBrowserCredential"
            )
          }

          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Path $metadataPath -Encoding utf8NoBOM
          "VESLO_WINDOWS_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV
          Get-Content $metadataPath

      - name: Run dlib signing probe
        shell: pwsh
        env:
          AZURE_LOG_LEVEL: DEBUG
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            ./scripts/release/windows-sign.ps1 -TargetFile $env:VESLO_SIGNING_PROBE_PATH
          } finally {
            $timer.Stop()
            Write-Host "Dlib signing elapsed: $($timer.Elapsed)"
          }

      - name: Verify dlib signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath $env:VESLO_SIGNING_PROBE_PATH
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate | Out-String | Write-Host
          if ($signature.Status -ne 'Valid') {
            throw "Dlib probe signature is not valid"
          }

  official-action-probe:
    name: Official Artifact Signing Action probe
    runs-on: windows-2022
    timeout-minutes: 10
    environment: release-signing
    env:
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
      VESLO_SIGNING_PROBE_PATH: ${{ github.workspace }}\SigningProbe-official.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Probe Azure CLI token
        shell: pwsh
        run: |
          $tokenTimer = [System.Diagnostics.Stopwatch]::StartNew()
          $tokenInfo = az account get-access-token --resource https://codesigning.azure.net --query '{expiresOn:expiresOn,subscription:subscription,tenant:tenant,tokenType:tokenType}' -o json
          $tokenTimer.Stop()
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI token acquisition failed with exit code $LASTEXITCODE"
          }
          Write-Host "Azure CLI token acquired in $($tokenTimer.ElapsedMilliseconds) ms"
          Write-Host $tokenInfo

      - name: Create unsigned signing probe
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "signing-probe-official"
          $publishRoot = Join-Path $probeRoot "publish"
          dotnet new console --name SigningProbe --output $probeRoot --framework net8.0 --force
          Set-Content -Path (Join-Path $probeRoot "Program.cs") -Value 'Console.WriteLine("Veslo official action probe");' -Encoding utf8NoBOM
          dotnet publish (Join-Path $probeRoot "SigningProbe.csproj") --configuration Release --runtime win-x64 --self-contained false --output $publishRoot -p:UseAppHost=true
          Copy-Item -Path (Join-Path $publishRoot "SigningProbe.exe") -Destination $env:VESLO_SIGNING_PROBE_PATH -Force
          $signature = Get-AuthenticodeSignature -FilePath $env:VESLO_SIGNING_PROBE_PATH
          Write-Host "Initial signature status: $($signature.Status)"
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned probe, got $($signature.Status)"
          }

      - name: Sign with official Artifact Signing Action
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          files: ${{ env.VESLO_SIGNING_PROBE_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 120
          cache-dependencies: false
          trace: true

      - name: Verify official action signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath $env:VESLO_SIGNING_PROBE_PATH
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate | Out-String | Write-Host
          if ($signature.Status -ne 'Valid') {
            throw "Official action probe signature is not valid"
          }
