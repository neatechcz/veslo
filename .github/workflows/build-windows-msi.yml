name: Build Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-msi:
    name: Build MSI (Windows)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '' }}

    steps:
      - name: Enable git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Create CI Tauri config (disable updater artifacts)
        shell: bash
        run: |
          node -e "const fs=require('fs'); const configPath='packages/desktop/src-tauri/tauri.conf.json'; const ciPath='packages/desktop/src-tauri/tauri.conf.ci.json'; const config=JSON.parse(fs.readFileSync(configPath,'utf8')); config.bundle={...config.bundle, createUpdaterArtifacts:false}; fs.writeFileSync(ciPath, JSON.stringify(config, null, 2));"

      - name: Build Windows MSI
        run: pnpm --filter @neatech/veslo exec tauri build --config src-tauri/tauri.conf.ci.json --target x86_64-pc-windows-msvc --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: veslo-windows-msi-x86_64-pc-windows-msvc
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*
          if-no-files-found: error
