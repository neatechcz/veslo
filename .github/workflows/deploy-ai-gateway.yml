name: Deploy AI Gateway

on:
  push:
    branches:
      - codex/ai-gateway-control-plane
    paths:
      - "services/ai-gateway/**"
      - ".github/workflows/deploy-ai-gateway.yml"
  workflow_dispatch:
    inputs:
      service_name:
        description: Render service name
        required: false
        type: string
        default: veslo-ai-gateway-dev
      branch:
        description: Git branch to deploy
        required: false
        type: string
        default: ""
      diagnose_only:
        description: Print sanitized Render topology and exit without deploying
        required: false
        type: boolean
        default: false
      diagnose_logs:
        description: Print recent sanitized Render logs and exit without deploying
        required: false
        type: boolean
        default: false
      replace_mismatched_region:
        description: Delete and recreate the AI Gateway service if it is in the wrong Render region
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-ai-gateway-${{ github.event.inputs.service_name || 'veslo-ai-gateway-dev' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'neatechcz/veslo'
    steps:
      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEN_CONTROL_PLANE_SERVICE_ID: ${{ secrets.RENDER_DEN_CONTROL_PLANE_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          DEN_DATABASE_URL: ${{ secrets.DEN_DATABASE_URL }}
          AI_GATEWAY_DATABASE_URL: ${{ secrets.AI_GATEWAY_DATABASE_URL || secrets.MANAGED_AI_DATABASE_URL || secrets.DEN_DATABASE_URL }}
          AI_GATEWAY_SECRET_KEY: ${{ secrets.AI_GATEWAY_SECRET_KEY || secrets.DEN_BETTER_AUTH_SECRET }}
          AI_GATEWAY_DIAGNOSE_ONLY: ${{ github.event.inputs.diagnose_only }}
          AI_GATEWAY_DIAGNOSE_LOGS: ${{ github.event.inputs.diagnose_logs }}
        run: |
          missing=0
          diagnose_only="${AI_GATEWAY_DIAGNOSE_ONLY:-false}"
          check_required() {
            key="$1"
            label="${2:-$1}"
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $label"
              missing=1
            fi
          }

          check_required RENDER_API_KEY
          check_required RENDER_OWNER_ID
          if [ "$diagnose_only" = "true" ]; then
            check_required RENDER_DEN_CONTROL_PLANE_SERVICE_ID
            check_required DEN_DATABASE_URL
          else
            check_required AI_GATEWAY_DATABASE_URL "AI_GATEWAY_DATABASE_URL (or MANAGED_AI_DATABASE_URL or DEN_DATABASE_URL)"
            check_required AI_GATEWAY_SECRET_KEY "AI_GATEWAY_SECRET_KEY (or DEN_BETTER_AUTH_SECRET)"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create or update Render AI gateway service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEN_CONTROL_PLANE_SERVICE_ID: ${{ secrets.RENDER_DEN_CONTROL_PLANE_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          DEN_DATABASE_URL: ${{ secrets.DEN_DATABASE_URL }}
          AI_GATEWAY_DATABASE_URL: ${{ secrets.AI_GATEWAY_DATABASE_URL || secrets.MANAGED_AI_DATABASE_URL || secrets.DEN_DATABASE_URL }}
          AI_GATEWAY_SECRET_KEY: ${{ secrets.AI_GATEWAY_SECRET_KEY || secrets.DEN_BETTER_AUTH_SECRET }}
          AI_GATEWAY_DIAGNOSE_ONLY: ${{ github.event.inputs.diagnose_only }}
          AI_GATEWAY_DIAGNOSE_LOGS: ${{ github.event.inputs.diagnose_logs }}
          AI_GATEWAY_REPLACE_MISMATCHED_REGION: ${{ github.event.inputs.replace_mismatched_region }}
          AI_GATEWAY_RENDER_SERVICE_NAME: ${{ github.event.inputs.service_name }}
          AI_GATEWAY_RENDER_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          api_key = os.environ["RENDER_API_KEY"]
          owner_id = os.environ["RENDER_OWNER_ID"]
          service_name = os.environ.get("AI_GATEWAY_RENDER_SERVICE_NAME") or "veslo-ai-gateway-dev"
          branch = os.environ.get("AI_GATEWAY_RENDER_BRANCH") or os.environ.get("GITHUB_REF_NAME") or "main"
          repo = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'neatechcz/veslo')}"
          root_dir = "services/ai-gateway"
          plan = "starter"
          region = "oregon"
          build_command = "corepack enable && corepack prepare pnpm@10.27.0 --activate && pnpm install --no-frozen-lockfile && pnpm build"
          start_command = "pnpm start"
          diagnose_only = (os.environ.get("AI_GATEWAY_DIAGNOSE_ONLY") or "false").lower() == "true"
          diagnose_logs = (os.environ.get("AI_GATEWAY_DIAGNOSE_LOGS") or "false").lower() == "true"
          replace_mismatched_region = (
              (os.environ.get("AI_GATEWAY_REPLACE_MISMATCHED_REGION") or "false").lower() == "true"
          )
          den_service_id = os.environ.get("RENDER_DEN_CONTROL_PLANE_SERVICE_ID") or ""

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, body=None):
              url = f"https://api.render.com/v1{path}"
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      text = resp.read().decode("utf-8")
                      return resp.status, json.loads(text) if text else None
              except urllib.error.HTTPError as err:
                  text = err.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path} failed ({err.code}): {text[:600]}")

          def list_services(limit: int = 200):
              rows = []
              cursor = None

              while len(rows) < limit:
                  query = urllib.parse.urlencode(
                      {k: v for k, v in {"limit": "100", "cursor": cursor}.items() if v},
                      doseq=True,
                  )
                  _, page = request("GET", f"/services?{query}")
                  if not page:
                      break

                  rows.extend(
                      entry["service"]
                      for entry in page
                      if isinstance(entry, dict) and isinstance(entry.get("service"), dict) and entry["service"].get("id")
                  )

                  next_cursor = page[-1].get("cursor") if isinstance(page[-1], dict) else None
                  if not next_cursor or next_cursor == cursor:
                      break
                  cursor = next_cursor

              return rows[:limit]

          def service_region(service):
              if not isinstance(service, dict):
                  return ""
              details = service.get("serviceDetails") or {}
              env_details = details.get("envSpecificDetails") or {}
              return (
                  details.get("region")
                  or env_details.get("region")
                  or service.get("region")
                  or ""
              )

          def service_summary(service):
              if not isinstance(service, dict):
                  return None
              details = service.get("serviceDetails") or {}
              return {
                  "id": service.get("id"),
                  "name": service.get("name"),
                  "type": service.get("type"),
                  "region": service_region(service),
                  "repo": service.get("repo"),
                  "branch": service.get("branch"),
                  "rootDir": service.get("rootDir"),
                  "url": details.get("url"),
              }

          def database_host(database_url):
              parsed = urllib.parse.urlparse(database_url or "")
              return parsed.hostname or ""

          def create_service(payload):
              last_error = None
              for _ in range(12):
                  try:
                      return request("POST", "/services", payload)
                  except RuntimeError as err:
                      last_error = err
                      if " 409" not in str(err) and "(409)" not in str(err):
                          raise
                      time.sleep(10)
              raise RuntimeError(f"Timed out waiting for Render service name to become reusable: {last_error}")

          def wait_for_service_deleted(name):
              for _ in range(60):
                  services_after_delete = list_services()
                  if not any(service.get("name") == name for service in services_after_delete):
                      return services_after_delete
                  time.sleep(5)
              raise RuntimeError(f"Timed out waiting for Render service {name} to be deleted")

          def wait_for_health(health_url: str, timeout_seconds: int = 180):
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  try:
                      req = urllib.request.Request(health_url, headers={"Accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          body = json.loads(resp.read().decode("utf-8"))
                          if resp.status == 200 and body.get("ok") is True:
                              return
                  except Exception:
                      pass
                  time.sleep(5)
              raise RuntimeError(f"Timed out waiting for health endpoint {health_url}")

          def wait_for_new_deploy(service_id: str, before_id: str | None):
              for _ in range(30):
                  time.sleep(5)
                  _, deploys = request("GET", f"/services/{service_id}/deploys?limit=1")
                  if not deploys:
                      continue
                  latest = deploys[0]["deploy"]
                  if latest["id"] != before_id:
                      return latest["id"]
              raise RuntimeError("No new deploy appeared after triggering")

          def recent_log_lines(service_id: str, limit: int = 80):
              logs_query = urllib.parse.urlencode(
                  {
                      "ownerId": owner_id,
                      "resource": [service_id],
                      "type": ["app", "build"],
                      "direction": "backward",
                      "limit": str(limit),
                  },
                  doseq=True,
              )
              _, recent_logs = request("GET", f"/logs?{logs_query}")
              raw_logs = [
                  entry
                  for entry in (recent_logs or {}).get("logs", [])
                  if isinstance(entry, dict)
              ]
              raw_logs.sort(key=lambda entry: entry.get("timestamp") or "", reverse=True)

              log_lines = []
              for entry in raw_logs:
                  message = entry.get("message")
                  if not isinstance(message, str) or not message.strip():
                      continue
                  log_lines.append(
                      {
                          "timestamp": entry.get("timestamp"),
                          "message": message[:1000],
                      }
                  )
                  if len(log_lines) >= min(limit, 40):
                      break
              return log_lines

          def wait_for_deploy_live(service_id: str, deploy_id: str):
              terminal = {"live", "update_failed", "build_failed", "canceled"}
              started = time.time()

              while time.time() - started < 1800:
                  _, deploys = request("GET", f"/services/{service_id}/deploys?limit=1")
                  latest = deploys[0]["deploy"] if deploys else None
                  if latest and latest.get("id") == deploy_id and latest.get("status") in terminal:
                      status = latest.get("status")
                      if status != "live":
                          print(
                              "Render recent logs:",
                              json.dumps({"deployId": deploy_id, "status": status, "logs": recent_log_lines(service_id)}),
                          )
                          raise RuntimeError(f"Render deploy {deploy_id} ended with {status}")
                      return
                  time.sleep(10)

              raise RuntimeError(f"Timed out waiting for deploy {deploy_id}")

          services = list_services()
          existing = next((service for service in services if service.get("name") == service_name), None)
          den_service = None
          if den_service_id:
              _, den_service = request("GET", f"/services/{den_service_id}")

          den_region = service_region(den_service)
          if den_region:
              region = den_region

          if diagnose_only:
              candidates = [
                  service_summary(service)
                  for service in services
                  if any(
                      token in (service.get("name") or "").lower()
                      for token in ("ai-gateway", "gateway", "den", "mysql", "veslo")
                  )
              ]
              print(
                  "Render topology diagnostic:",
                  json.dumps(
                      {
                          "databaseHost": database_host(os.environ.get("DEN_DATABASE_URL")),
                          "denControlPlane": service_summary(den_service),
                          "aiGateway": service_summary(existing),
                          "matchingServices": candidates,
                          "selectedCreateRegion": region,
                      },
                      sort_keys=True,
                  ),
              )
              raise SystemExit(0)

          if diagnose_logs:
              if not existing:
                  raise RuntimeError(f"Render service {service_name} was not found")
              print(
                  "Render logs diagnostic:",
                  json.dumps(
                      {
                          "service": service_summary(existing),
                          "logs": recent_log_lines(existing["id"]),
                      },
                      sort_keys=True,
                  ),
              )
              raise SystemExit(0)

          if existing:
              existing_region = service_region(existing)
              if den_region and existing_region and existing_region != den_region:
                  mismatch = {
                      "name": service_name,
                      "serviceId": existing.get("id"),
                      "currentRegion": existing_region,
                      "requiredRegion": den_region,
                      "databaseHost": database_host(os.environ.get("AI_GATEWAY_DATABASE_URL")),
                  }
                  if not replace_mismatched_region:
                      raise RuntimeError(
                          "Render AI Gateway service is in the wrong region for the private database: "
                          f"{json.dumps(mismatch, sort_keys=True)}. "
                          "Rerun with replace_mismatched_region=true to delete and recreate the service in the required region."
                      )

                  print("Replacing Render AI gateway service for region migration:", json.dumps(mismatch, sort_keys=True))
                  request("DELETE", f"/services/{existing['id']}")
                  services = wait_for_service_deleted(service_name)
                  existing = None

          if existing:
              service_id = existing["id"]
              patch = {}
              if existing.get("repo") != repo:
                  patch["repo"] = repo
              if existing.get("branch") != branch:
                  patch["branch"] = branch
              if existing.get("rootDir") != root_dir:
                  patch["rootDir"] = root_dir
              if existing.get("autoDeploy") != "no":
                  patch["autoDeploy"] = "no"

              if patch:
                  print("Updating Render service source:", json.dumps(patch))
                  request("PATCH", f"/services/{service_id}", patch)
          else:
              payload = {
                  "type": "web_service",
                  "name": service_name,
                  "ownerId": owner_id,
                  "repo": repo,
                  "branch": branch,
                  "autoDeploy": "no",
                  "rootDir": root_dir,
                  "serviceDetails": {
                      "runtime": "node",
                      "plan": plan,
                      "region": region,
                      "healthCheckPath": "/health",
                      "envSpecificDetails": {
                          "buildCommand": build_command,
                          "startCommand": start_command,
                      },
                  },
              }
              print("Creating Render service:", json.dumps({"name": service_name, "branch": branch, "rootDir": root_dir}))
              _, created = create_service(payload)
              service_id = created["service"]["id"]

          _, service = request("GET", f"/services/{service_id}")
          service_url = (service.get("serviceDetails") or {}).get("url")
          if not service_url:
              raise RuntimeError(f"Render service {service_id} has no public URL")

          _, current_env_vars = request("GET", f"/services/{service_id}/env-vars")
          env_by_key = {}
          for row in current_env_vars or []:
              env_var = row.get("envVar") if isinstance(row, dict) else None
              if not isinstance(env_var, dict):
                  continue
              key = env_var.get("key")
              value = env_var.get("value")
              if isinstance(key, str) and isinstance(value, str):
                  env_by_key[key] = value

          env_by_key.update(
              {
                  "AI_GATEWAY_DATABASE_URL": os.environ["AI_GATEWAY_DATABASE_URL"],
                  "AI_GATEWAY_SECRET_KEY": os.environ["AI_GATEWAY_SECRET_KEY"],
                  "AI_GATEWAY_DEN_API_BASE": "https://den-control-plane-veslo.onrender.com",
                  "AI_GATEWAY_OPENAI_REDIRECT_BASE": f"{service_url.rstrip('/')}/auth/openai",
              }
          )
          request(
              "PUT",
              f"/services/{service_id}/env-vars",
              [{"key": key, "value": value} for key, value in sorted(env_by_key.items())],
          )

          _, before = request("GET", f"/services/{service_id}/deploys?limit=1")
          before_id = before[0]["deploy"]["id"] if before else None

          request("POST", f"/services/{service_id}/deploys", {})
          print("Deploy triggered, waiting for new deploy to appear...")

          deploy_id = wait_for_new_deploy(service_id, before_id)
          print(f"New deploy detected: {deploy_id}")
          wait_for_deploy_live(service_id, deploy_id)

          wait_for_health(f"{service_url.rstrip('/')}/health")
          print(f"Render AI gateway deploy {deploy_id} is live at {service_url}")
          PY
