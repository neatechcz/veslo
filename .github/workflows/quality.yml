name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.0"
  PNPM_VERSION: "10.27.0"
  BUN_VERSION: "1.3.11"
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  static:
    name: Quality / Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static quality checks
        run: pnpm check:lint && pnpm check:types && pnpm check:architecture

  unit:
    name: Quality / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and contract checks
        run: pnpm check:unit

  rust:
    name: Quality / Rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop sidecars for Rust checks
        run: pnpm --filter @neatech/veslo run prepare:sidecar

      - name: Run Rust quality checks
        run: pnpm check:rust

  desktop-recovery:
    name: Quality / Desktop recovery
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri Pilot CLI
        run: cargo install tauri-pilot-cli --version 0.7.2 --locked

      - name: Run focused desktop recovery check
        run: pnpm check:desktop-recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload desktop recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-desktop-recovery-diagnostics
          path: packages/e2e/tauri-pilot-failures/**
          if-no-files-found: ignore

  gate:
    name: Quality / Gate
    needs: [static, unit, rust, desktop-recovery]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_RECOVERY_RESULT: ${{ needs.desktop-recovery.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$DESKTOP_RECOVERY_RESULT" = "success"
