name: Deploy Den

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "services/den/**"
      - "services/den-worker-runtime/**"
      - ".github/workflows/deploy-den.yml"
  workflow_dispatch:
    inputs:
      grant_platform_admin_email:
        description: "DEN user email to grant platform_admin. When set, the workflow runs only this op and skips deploy."
        required: false
        type: string
      grant_platform_admin_apply:
        description: "Apply the platform_admin grant. Leave false for a dry run."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-den-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grant-platform-admin:
    runs-on: ubuntu-latest
    if: github.repository == 'neatechcz/veslo' && github.event_name == 'workflow_dispatch' && inputs.grant_platform_admin_email != ''
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install DEN dependencies
        run: pnpm install --filter @neatech/den... --frozen-lockfile

      - name: Grant platform admin role
        working-directory: services/den
        env:
          DATABASE_URL: ${{ secrets.DEN_DATABASE_URL }}
          TARGET_EMAIL: ${{ inputs.grant_platform_admin_email }}
          APPLY_GRANT: ${{ inputs.grant_platform_admin_apply }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const mysql = require("mysql2/promise");

          (async () => {
            const databaseUrl = process.env.DATABASE_URL;
            const targetEmail = (process.env.TARGET_EMAIL || "").trim().toLowerCase();
            const applyGrant = (process.env.APPLY_GRANT || "false").toLowerCase() === "true";

            if (!databaseUrl) {
              throw new Error("DATABASE_URL is required");
            }
            if (!targetEmail || !targetEmail.includes("@")) {
              throw new Error("TARGET_EMAIL must be a valid email");
            }

            const connection = await mysql.createConnection(databaseUrl);
            try {
              const [users] = await connection.execute(
                "SELECT id, email FROM `user` WHERE lower(email) = ? LIMIT 1",
                [targetEmail],
              );
              const user = Array.isArray(users) ? users[0] : null;
              if (!user?.id || !user?.email) {
                throw new Error(`user_not_found:${targetEmail}`);
              }

              const [existingRows] = await connection.execute(
                "SELECT id, role FROM platform_role WHERE user_id = ? AND role = 'platform_admin' LIMIT 1",
                [user.id],
              );
              const existing = Array.isArray(existingRows) ? existingRows[0] : null;

              if (applyGrant && !existing) {
                await connection.execute(
                  "INSERT INTO platform_role (id, user_id, role, created_at) VALUES (?, ?, 'platform_admin', CURRENT_TIMESTAMP(3)) ON DUPLICATE KEY UPDATE role = 'platform_admin'",
                  [`platform_role_${crypto.randomUUID()}`, user.id],
                );
              }

              const [afterRows] = await connection.execute(
                "SELECT id, role FROM platform_role WHERE user_id = ? AND role = 'platform_admin' LIMIT 1",
                [user.id],
              );
              const after = Array.isArray(afterRows) ? afterRows[0] : null;

              console.log(JSON.stringify({
                email: user.email,
                userId: user.id,
                hadPlatformAdminRole: Boolean(existing),
                applied: applyGrant,
                hasPlatformAdminRole: Boolean(after),
              }));
            } finally {
              await connection.end();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'neatechcz/veslo' && (github.event_name != 'workflow_dispatch' || inputs.grant_platform_admin_email == '')
    steps:
      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEN_CONTROL_PLANE_SERVICE_ID: ${{ secrets.RENDER_DEN_CONTROL_PLANE_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          DEN_DATABASE_URL: ${{ secrets.DEN_DATABASE_URL }}
          DEN_BETTER_AUTH_SECRET: ${{ secrets.DEN_BETTER_AUTH_SECRET }}
          MANAGED_AI_DATABASE_URL: ${{ secrets.MANAGED_AI_DATABASE_URL || secrets.DEN_DATABASE_URL }}
          MANAGED_AI_SECRET_KEY: ${{ secrets.MANAGED_AI_SECRET_KEY || secrets.DEN_BETTER_AUTH_SECRET }}
          MANAGED_AI_OPENAI_CLIENT_ID: ${{ secrets.MANAGED_AI_OPENAI_CLIENT_ID }}
          MANAGED_AI_OPENAI_CLIENT_SECRET: ${{ secrets.MANAGED_AI_OPENAI_CLIENT_SECRET }}
          MANAGED_AI_OPENAI_REDIRECT_BASE: ${{ vars.MANAGED_AI_OPENAI_REDIRECT_BASE }}
          MANAGED_AI_CODEX_AUTH_JSON: ${{ secrets.MANAGED_AI_CODEX_AUTH_JSON }}
          DEN_GITHUB_CLIENT_ID: ${{ secrets.DEN_GITHUB_CLIENT_ID }}
          DEN_GITHUB_CLIENT_SECRET: ${{ secrets.DEN_GITHUB_CLIENT_SECRET }}
          DEN_LETTR_API_KEY: ${{ secrets.DEN_LETTR_API_KEY }}
          DEN_AUTH_EMAIL_ADDRESS: ${{ vars.DEN_AUTH_EMAIL_ADDRESS }}
          DEN_AUTH_EMAIL_FROM_NAME: ${{ vars.DEN_AUTH_EMAIL_FROM_NAME }}
          DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED: ${{ vars.DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_PRODUCT_ID: ${{ secrets.POLAR_PRODUCT_ID }}
          POLAR_BENEFIT_ID: ${{ secrets.POLAR_BENEFIT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX: ${{ vars.DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX }}
          DEN_POLAR_FEATURE_GATE_ENABLED: ${{ vars.DEN_POLAR_FEATURE_GATE_ENABLED }}
        run: |
          missing=0
          for key in RENDER_API_KEY RENDER_DEN_CONTROL_PLANE_SERVICE_ID RENDER_OWNER_ID DEN_DATABASE_URL DEN_BETTER_AUTH_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          vanity_suffix="${DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX:-veslo.studio}"
          if [ -n "$vanity_suffix" ] && [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing required secret: VERCEL_TOKEN (required when vanity domains are enabled)"
            missing=1
          fi

          feature_enabled="${DEN_POLAR_FEATURE_GATE_ENABLED:-false}"
          feature_enabled="$(echo "$feature_enabled" | tr '[:upper:]' '[:lower:]')"
          if [ "$feature_enabled" = "true" ]; then
            for key in POLAR_ACCESS_TOKEN POLAR_PRODUCT_ID POLAR_BENEFIT_ID; do
              if [ -z "${!key}" ]; then
                echo "::error::Missing required paywall secret: $key"
                missing=1
              fi
            done
          fi

          if [ -n "$DEN_GITHUB_CLIENT_ID" ] && [ -z "$DEN_GITHUB_CLIENT_SECRET" ]; then
            echo "::error::Missing required secret: DEN_GITHUB_CLIENT_SECRET (required when DEN_GITHUB_CLIENT_ID is set)"
            missing=1
          fi

          if [ -n "$DEN_GITHUB_CLIENT_SECRET" ] && [ -z "$DEN_GITHUB_CLIENT_ID" ]; then
            echo "::error::Missing required secret: DEN_GITHUB_CLIENT_ID (required when DEN_GITHUB_CLIENT_SECRET is set)"
            missing=1
          fi

          if [ -n "$DEN_LETTR_API_KEY" ] && [ -z "$DEN_AUTH_EMAIL_ADDRESS" ]; then
            echo "::error::Missing required variable: DEN_AUTH_EMAIL_ADDRESS (required when DEN_LETTR_API_KEY is set)"
            missing=1
          fi

          if [ -n "$DEN_AUTH_EMAIL_ADDRESS" ] && [ -z "$DEN_LETTR_API_KEY" ]; then
            echo "::error::Missing required secret: DEN_LETTR_API_KEY (required when DEN_AUTH_EMAIL_ADDRESS is set)"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Sync Render env vars and deploy latest commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEN_CONTROL_PLANE_SERVICE_ID: ${{ secrets.RENDER_DEN_CONTROL_PLANE_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          DEN_DATABASE_URL: ${{ secrets.DEN_DATABASE_URL }}
          DEN_BETTER_AUTH_SECRET: ${{ secrets.DEN_BETTER_AUTH_SECRET }}
          MANAGED_AI_DATABASE_URL: ${{ secrets.MANAGED_AI_DATABASE_URL || secrets.DEN_DATABASE_URL }}
          MANAGED_AI_SECRET_KEY: ${{ secrets.MANAGED_AI_SECRET_KEY || secrets.DEN_BETTER_AUTH_SECRET }}
          MANAGED_AI_OPENAI_CLIENT_ID: ${{ secrets.MANAGED_AI_OPENAI_CLIENT_ID }}
          MANAGED_AI_OPENAI_CLIENT_SECRET: ${{ secrets.MANAGED_AI_OPENAI_CLIENT_SECRET }}
          MANAGED_AI_OPENAI_REDIRECT_BASE: ${{ vars.MANAGED_AI_OPENAI_REDIRECT_BASE }}
          MANAGED_AI_CODEX_HOME: ${{ vars.MANAGED_AI_CODEX_HOME }}
          MANAGED_AI_CODEX_WORKDIR: ${{ vars.MANAGED_AI_CODEX_WORKDIR }}
          MANAGED_AI_CODEX_TIMEOUT_MS: ${{ vars.MANAGED_AI_CODEX_TIMEOUT_MS }}
          MANAGED_AI_CODEX_COMMAND: ${{ vars.MANAGED_AI_CODEX_COMMAND }}
          MANAGED_AI_CODEX_AUTH_JSON: ${{ secrets.MANAGED_AI_CODEX_AUTH_JSON }}
          DEN_GITHUB_CLIENT_ID: ${{ secrets.DEN_GITHUB_CLIENT_ID }}
          DEN_GITHUB_CLIENT_SECRET: ${{ secrets.DEN_GITHUB_CLIENT_SECRET }}
          DEN_LETTR_API_KEY: ${{ secrets.DEN_LETTR_API_KEY }}
          DEN_AUTH_EMAIL_ADDRESS: ${{ vars.DEN_AUTH_EMAIL_ADDRESS }}
          DEN_AUTH_EMAIL_FROM_NAME: ${{ vars.DEN_AUTH_EMAIL_FROM_NAME }}
          DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED: ${{ vars.DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED }}
          DEN_RENDER_CONTROL_PLANE_REPO: ${{ vars.DEN_RENDER_CONTROL_PLANE_REPO }}
          DEN_RENDER_CONTROL_PLANE_BRANCH: ${{ vars.DEN_RENDER_CONTROL_PLANE_BRANCH }}
          DEN_RENDER_CONTROL_PLANE_ROOT_DIR: ${{ vars.DEN_RENDER_CONTROL_PLANE_ROOT_DIR }}
          DEN_RENDER_WORKER_REPO: ${{ vars.DEN_RENDER_WORKER_REPO }}
          DEN_RENDER_WORKER_PLAN: ${{ vars.DEN_RENDER_WORKER_PLAN }}
          DEN_RENDER_WORKER_VESLO_VERSION: ${{ vars.DEN_RENDER_WORKER_VESLO_VERSION }}
          DEN_CORS_ORIGINS: ${{ vars.DEN_CORS_ORIGINS }}
          DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX: ${{ vars.DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX }}
          DEN_RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS: ${{ vars.DEN_RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS }}
          DEN_VERCEL_API_BASE: ${{ vars.DEN_VERCEL_API_BASE }}
          DEN_VERCEL_TEAM_ID: ${{ vars.DEN_VERCEL_TEAM_ID }}
          DEN_VERCEL_TEAM_SLUG: ${{ vars.DEN_VERCEL_TEAM_SLUG }}
          DEN_VERCEL_DNS_DOMAIN: ${{ vars.DEN_VERCEL_DNS_DOMAIN }}
          DEN_POLAR_FEATURE_GATE_ENABLED: ${{ vars.DEN_POLAR_FEATURE_GATE_ENABLED }}
          DEN_POLAR_API_BASE: ${{ vars.DEN_POLAR_API_BASE }}
          DEN_POLAR_SUCCESS_URL: ${{ vars.DEN_POLAR_SUCCESS_URL }}
          DEN_POLAR_RETURN_URL: ${{ vars.DEN_POLAR_RETURN_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_PRODUCT_ID: ${{ secrets.POLAR_PRODUCT_ID }}
          POLAR_BENEFIT_ID: ${{ secrets.POLAR_BENEFIT_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          api_key = os.environ["RENDER_API_KEY"]
          service_id = os.environ["RENDER_DEN_CONTROL_PLANE_SERVICE_ID"]
          owner_id = os.environ["RENDER_OWNER_ID"]
          debug_logs = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          veslo_version = os.environ.get("DEN_RENDER_WORKER_VESLO_VERSION") or "0.11.113"
          worker_plan = os.environ.get("DEN_RENDER_WORKER_PLAN") or "standard"
          default_repo = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'neatechcz/veslo')}"
          selected_branch = os.environ.get("GITHUB_REF_NAME") or "dev"
          configured_control_plane_branch = os.environ.get("DEN_RENDER_CONTROL_PLANE_BRANCH") or ""
          control_plane_repo = os.environ.get("DEN_RENDER_CONTROL_PLANE_REPO") or default_repo
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              control_plane_branch = selected_branch
          else:
              control_plane_branch = configured_control_plane_branch or selected_branch
          control_plane_root_dir = os.environ.get("DEN_RENDER_CONTROL_PLANE_ROOT_DIR") or "services/den"
          worker_repo = os.environ.get("DEN_RENDER_WORKER_REPO") or f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'neatechcz/veslo')}"
          managed_ai_database_url = os.environ.get("MANAGED_AI_DATABASE_URL") or os.environ["DEN_DATABASE_URL"]
          managed_ai_secret_key = os.environ.get("MANAGED_AI_SECRET_KEY") or os.environ["DEN_BETTER_AUTH_SECRET"]
          managed_ai_openai_client_id = os.environ.get("MANAGED_AI_OPENAI_CLIENT_ID") or ""
          managed_ai_openai_client_secret = os.environ.get("MANAGED_AI_OPENAI_CLIENT_SECRET") or ""
          managed_ai_openai_redirect_base = os.environ.get("MANAGED_AI_OPENAI_REDIRECT_BASE") or ""
          managed_ai_codex_home = os.environ.get("MANAGED_AI_CODEX_HOME") or "/tmp/veslo-codex-home"
          managed_ai_codex_workdir = os.environ.get("MANAGED_AI_CODEX_WORKDIR") or "/tmp"
          managed_ai_codex_timeout_ms = os.environ.get("MANAGED_AI_CODEX_TIMEOUT_MS") or "180000"
          managed_ai_codex_command = os.environ.get("MANAGED_AI_CODEX_COMMAND") or "codex"
          managed_ai_codex_auth_json = os.environ.get("MANAGED_AI_CODEX_AUTH_JSON") or ""
          configured_cors_origins = os.environ.get("DEN_CORS_ORIGINS") or ""
          worker_public_domain_suffix = os.environ.get("DEN_RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX") or "veslo.studio"
          custom_domain_ready_timeout_ms = os.environ.get("DEN_RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS") or "240000"
          vercel_api_base = os.environ.get("DEN_VERCEL_API_BASE") or "https://api.vercel.com"
          vercel_team_id = os.environ.get("DEN_VERCEL_TEAM_ID") or ""
          vercel_team_slug = os.environ.get("DEN_VERCEL_TEAM_SLUG") or "prologe"
          vercel_dns_domain = os.environ.get("DEN_VERCEL_DNS_DOMAIN") or worker_public_domain_suffix
          vercel_token = os.environ.get("VERCEL_TOKEN") or ""
          paywall_enabled = (os.environ.get("DEN_POLAR_FEATURE_GATE_ENABLED") or "false").lower() == "true"
          polar_api_base = os.environ.get("DEN_POLAR_API_BASE") or "https://api.polar.sh"
          polar_success_url = os.environ.get("DEN_POLAR_SUCCESS_URL") or "https://app.veslo.neatech.com"
          polar_return_url = os.environ.get("DEN_POLAR_RETURN_URL") or polar_success_url
          polar_access_token = os.environ.get("POLAR_ACCESS_TOKEN") or ""
          polar_product_id = os.environ.get("POLAR_PRODUCT_ID") or ""
          polar_benefit_id = os.environ.get("POLAR_BENEFIT_ID") or ""
          github_client_id = os.environ.get("DEN_GITHUB_CLIENT_ID") or ""
          github_client_secret = os.environ.get("DEN_GITHUB_CLIENT_SECRET") or ""
          lettr_api_key = (os.environ.get("DEN_LETTR_API_KEY") or "").strip()
          auth_email_address = (os.environ.get("DEN_AUTH_EMAIL_ADDRESS") or "").strip()
          auth_email_from_name = (os.environ.get("DEN_AUTH_EMAIL_FROM_NAME") or "").strip()
          configured_desktop_auth_require_email_verified = (
              (os.environ.get("DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED") or "").strip() or None
          )
          desktop_auth_require_email_verified = False

          if bool(github_client_id) != bool(github_client_secret):
              raise RuntimeError(
                  "DEN_GITHUB_CLIENT_ID and DEN_GITHUB_CLIENT_SECRET must either both be set or both be empty"
              )

          if bool(lettr_api_key) != bool(auth_email_address):
              raise RuntimeError(
                  "DEN_LETTR_API_KEY and DEN_AUTH_EMAIL_ADDRESS must either both be set or both be empty"
              )

          def validate_redirect_url(name: str, value: str):
              parsed = urllib.parse.urlparse(value)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise RuntimeError(f"{name} must be an absolute http(s) URL, got: {value}")

          validate_redirect_url("DEN_POLAR_SUCCESS_URL", polar_success_url)
          validate_redirect_url("DEN_POLAR_RETURN_URL", polar_return_url)

          if paywall_enabled and (not polar_access_token or not polar_product_id or not polar_benefit_id):
              raise RuntimeError(
                  "DEN_POLAR_FEATURE_GATE_ENABLED=true requires POLAR_ACCESS_TOKEN, POLAR_PRODUCT_ID, and POLAR_BENEFIT_ID"
              )

          def normalize_origin(value: str) -> str:
              trimmed = value.strip()
              if trimmed == "*":
                  return trimmed
              return trimmed.rstrip("/")

          def build_cors_origins(raw: str, defaults: list[str]) -> str:
              candidates: list[str] = []
              if raw.strip():
                  candidates.extend(raw.split(","))
              candidates.extend(defaults)

              seen = set()
              normalized = []
              for value in candidates:
                  origin = normalize_origin(value)
                  if not origin or origin in seen:
                      continue
                  seen.add(origin)
                  normalized.append(origin)

              if not normalized:
                  raise RuntimeError("Unable to derive CORS_ORIGINS for Den deployment")

              return ",".join(normalized)

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, body=None):
              url = f"https://api.render.com/v1{path}"
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      text = resp.read().decode("utf-8")
                      return resp.status, json.loads(text) if text else None
              except urllib.error.HTTPError as err:
                  text = err.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path} failed ({err.code}): {text[:600]}")

          _, service = request("GET", f"/services/{service_id}")
          source_patch = {}
          if service.get("repo") != control_plane_repo:
              source_patch["repo"] = control_plane_repo
          if service.get("branch") != control_plane_branch:
              source_patch["branch"] = control_plane_branch
          if service.get("rootDir") != control_plane_root_dir:
              source_patch["rootDir"] = control_plane_root_dir

          if source_patch:
              print("Updating Render control-plane source:", json.dumps(source_patch))
              request("PATCH", f"/services/{service_id}", source_patch)
              _, service = request("GET", f"/services/{service_id}")

          service_url = (service.get("serviceDetails") or {}).get("url")
          print(
              "Render service source:",
              json.dumps(
                  {
                      "name": service.get("name"),
                      "repo": service.get("repo"),
                      "branch": service.get("branch"),
                      "rootDir": service.get("rootDir"),
                      "url": service_url,
                  }
              ),
          )
          if not service_url:
              raise RuntimeError(f"Render service {service_id} has no public URL")

          _, current_env_vars = request("GET", f"/services/{service_id}/env-vars")
          current_env_by_key = {}
          for row in current_env_vars or []:
              env_var = row.get("envVar") if isinstance(row, dict) else None
              if not isinstance(env_var, dict):
                  continue
              key = env_var.get("key")
              value = env_var.get("value")
              if isinstance(key, str) and isinstance(value, str):
                  current_env_by_key[key] = value

          if not lettr_api_key:
              lettr_api_key = current_env_by_key.get("LETTR_API_KEY", "")
          if not auth_email_address:
              auth_email_address = current_env_by_key.get("AUTH_EMAIL_ADDRESS", "")
          if not auth_email_from_name:
              auth_email_from_name = current_env_by_key.get("AUTH_EMAIL_FROM_NAME", "")
          if configured_desktop_auth_require_email_verified is None:
              desktop_auth_require_email_verified = (
                  current_env_by_key.get("DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED", "false").lower() == "true"
              )
          else:
              desktop_auth_require_email_verified = configured_desktop_auth_require_email_verified.lower() == "true"
          if not managed_ai_codex_auth_json:
              managed_ai_codex_auth_json = current_env_by_key.get("MANAGED_AI_CODEX_AUTH_JSON", "")

          if bool(lettr_api_key) != bool(auth_email_address):
              raise RuntimeError(
                  "Render auth email env must either define both LETTR_API_KEY and AUTH_EMAIL_ADDRESS or neither"
              )

          if desktop_auth_require_email_verified and (not lettr_api_key or not auth_email_address):
              raise RuntimeError(
                  "DEN_DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED=true requires DEN_LETTR_API_KEY and DEN_AUTH_EMAIL_ADDRESS"
              )

          cors_origins = build_cors_origins(
              configured_cors_origins,
              [
                  "https://app.veslo.neatech.com",
                  "https://api.veslo.neatech.com",
                  service_url,
              ],
          )

          env_vars = [
              {"key": "DATABASE_URL", "value": os.environ["DEN_DATABASE_URL"]},
              {"key": "BETTER_AUTH_SECRET", "value": os.environ["DEN_BETTER_AUTH_SECRET"]},
              {"key": "BETTER_AUTH_URL", "value": service_url},
              {"key": "MANAGED_AI_DATABASE_URL", "value": managed_ai_database_url},
              {"key": "MANAGED_AI_SECRET_KEY", "value": managed_ai_secret_key},
              {"key": "MANAGED_AI_OPENAI_CLIENT_ID", "value": managed_ai_openai_client_id},
              {"key": "MANAGED_AI_OPENAI_CLIENT_SECRET", "value": managed_ai_openai_client_secret},
              {"key": "MANAGED_AI_OPENAI_REDIRECT_BASE", "value": managed_ai_openai_redirect_base},
              {"key": "MANAGED_AI_CODEX_HOME", "value": managed_ai_codex_home},
              {"key": "MANAGED_AI_CODEX_WORKDIR", "value": managed_ai_codex_workdir},
              {"key": "MANAGED_AI_CODEX_TIMEOUT_MS", "value": managed_ai_codex_timeout_ms},
              {"key": "MANAGED_AI_CODEX_COMMAND", "value": managed_ai_codex_command},
              {"key": "MANAGED_AI_CODEX_AUTH_JSON", "value": managed_ai_codex_auth_json},
              {"key": "GITHUB_CLIENT_ID", "value": github_client_id},
              {"key": "GITHUB_CLIENT_SECRET", "value": github_client_secret},
              {"key": "LETTR_API_KEY", "value": lettr_api_key},
              {"key": "AUTH_EMAIL_ADDRESS", "value": auth_email_address},
              {"key": "AUTH_EMAIL_FROM_NAME", "value": auth_email_from_name},
              {"key": "DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED", "value": "true" if desktop_auth_require_email_verified else "false"},
              {"key": "CORS_ORIGINS", "value": cors_origins},
              {"key": "PROVISIONER_MODE", "value": "render"},
              {"key": "RENDER_API_BASE", "value": "https://api.render.com/v1"},
              {"key": "RENDER_API_KEY", "value": api_key},
              {"key": "RENDER_OWNER_ID", "value": owner_id},
              {"key": "RENDER_WORKER_REPO", "value": worker_repo},
              {"key": "RENDER_WORKER_BRANCH", "value": "dev"},
              {"key": "RENDER_WORKER_ROOT_DIR", "value": "services/den-worker-runtime"},
              {"key": "RENDER_WORKER_PLAN", "value": worker_plan},
              {"key": "RENDER_WORKER_REGION", "value": "oregon"},
              {"key": "RENDER_WORKER_VESLO_VERSION", "value": veslo_version},
              {"key": "RENDER_WORKER_NAME_PREFIX", "value": "den-worker-veslo"},
              {"key": "RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX", "value": worker_public_domain_suffix},
              {"key": "RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS", "value": custom_domain_ready_timeout_ms},
              {"key": "RENDER_PROVISION_TIMEOUT_MS", "value": "900000"},
              {"key": "RENDER_HEALTHCHECK_TIMEOUT_MS", "value": "180000"},
              {"key": "RENDER_POLL_INTERVAL_MS", "value": "5000"},
              {"key": "VERCEL_API_BASE", "value": vercel_api_base},
              {"key": "VERCEL_TOKEN", "value": vercel_token},
              {"key": "VERCEL_TEAM_ID", "value": vercel_team_id},
              {"key": "VERCEL_TEAM_SLUG", "value": vercel_team_slug},
              {"key": "VERCEL_DNS_DOMAIN", "value": vercel_dns_domain},
              {"key": "POLAR_FEATURE_GATE_ENABLED", "value": "true" if paywall_enabled else "false"},
              {"key": "POLAR_API_BASE", "value": polar_api_base},
              {"key": "POLAR_ACCESS_TOKEN", "value": polar_access_token},
              {"key": "POLAR_PRODUCT_ID", "value": polar_product_id},
              {"key": "POLAR_BENEFIT_ID", "value": polar_benefit_id},
              {"key": "POLAR_SUCCESS_URL", "value": polar_success_url},
              {"key": "POLAR_RETURN_URL", "value": polar_return_url},
          ]

          request("PUT", f"/services/{service_id}/env-vars", env_vars)

          # Snapshot current latest deploy to detect the new one
          _, before = request("GET", f"/services/{service_id}/deploys?limit=1")
          before_id = before[0]["deploy"]["id"] if before else None

          request("POST", f"/services/{service_id}/deploys", {})
          print("Deploy triggered, waiting for new deploy to appear...")

          # Wait for a new deploy to appear
          deploy_id = None
          for _ in range(30):
              time.sleep(5)
              _, deploys = request("GET", f"/services/{service_id}/deploys?limit=1")
              if deploys:
                  latest = deploys[0]["deploy"]
                  if latest["id"] != before_id:
                      deploy_id = latest["id"]
                      print(f"New deploy detected: {deploy_id}")
                      break
          if not deploy_id:
              raise RuntimeError("No new deploy appeared after triggering")

          terminal = {"live", "update_failed", "build_failed", "canceled"}
          started = time.time()

          while time.time() - started < 1800:
              _, deploys = request("GET", f"/services/{service_id}/deploys?limit=1")
              latest = deploys[0]["deploy"] if deploys else None
              if latest and latest.get("id") == deploy_id and latest.get("status") in terminal:
                  status = latest.get("status")
                  if status != "live":
                      _, deploy_detail = request("GET", f"/services/{service_id}/deploys/{deploy_id}")
                      _, service_events = request("GET", f"/services/{service_id}/events?limit=50")
                      logs_query = urllib.parse.urlencode(
                          {
                              "ownerId": owner_id,
                              "resource": [service_id],
                              "type": ["app", "build"],
                              "direction": "backward",
                              "limit": "80",
                          },
                          doseq=True,
                      )
                      _, recent_logs = request("GET", f"/logs?{logs_query}")
                      related_events = []
                      for row in service_events or []:
                          event = row.get("event") if isinstance(row, dict) else None
                          details = event.get("details") if isinstance(event, dict) else None
                          if not isinstance(details, dict):
                              continue
                          if details.get("deployId") != deploy_id:
                              continue
                          related_events.append(
                              {
                                  "type": event.get("type"),
                                  "timestamp": event.get("timestamp"),
                                  "details": details,
                              }
                          )
                          if len(related_events) >= 10:
                              break
                      log_lines = []
                      for entry in (recent_logs or {}).get("logs", []):
                          if not isinstance(entry, dict):
                              continue
                          message = entry.get("message")
                          if not isinstance(message, str) or not message.strip():
                              continue
                          log_lines.append(
                              {
                                  "timestamp": entry.get("timestamp"),
                                  "message": message[:300],
                              }
                          )
                          if len(log_lines) >= 20:
                              break
                      print(
                          "Render deploy failure detail:",
                          json.dumps(
                              {
                                  "deploy": deploy_detail.get("deploy"),
                                  "commit": deploy_detail.get("commit"),
                                  "trigger": deploy_detail.get("trigger"),
                                  "imageRef": deploy_detail.get("imageRef"),
                                  "events": related_events,
                              }
                          )[:2000],
                      )
                      print("Render recent logs:", json.dumps(log_lines))
                      raise RuntimeError(f"Render deploy {deploy_id} ended with {status}")
                  print(f"Render deploy {deploy_id} is live at {service_url}")
                  if debug_logs:
                      logs_query = urllib.parse.urlencode(
                          {
                              "ownerId": owner_id,
                              "resource": [service_id],
                              "type": ["app", "build"],
                              "direction": "backward",
                              "limit": "120",
                          },
                          doseq=True,
                      )
                      _, recent_logs = request("GET", f"/logs?{logs_query}")
                      runtime_lines = []
                      for entry in (recent_logs or {}).get("logs", []):
                          if not isinstance(entry, dict):
                              continue
                          message = entry.get("message")
                          if not isinstance(message, str) or not message.strip():
                              continue
                          runtime_lines.append(
                              {
                                  "timestamp": entry.get("timestamp"),
                                  "level": entry.get("level"),
                                  "message": message[:400],
                              }
                          )
                          if len(runtime_lines) >= 40:
                              break
                      print("Render recent runtime logs (workflow_dispatch):", json.dumps(runtime_lines))
                  break
              time.sleep(10)
          else:
              raise RuntimeError(f"Timed out waiting for deploy {deploy_id}")
          PY
