name: veslo-owned-server

x-node-app: &node-app
  working_dir: /app
  restart: unless-stopped
  init: true
  environment:
    CI: "true"
    NODE_ENV: production

services:
  den-db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DEN_DB_NAME:-den}
      MYSQL_USER: ${DEN_DB_USER:-den}
      MYSQL_PASSWORD: ${DEN_DB_PASSWORD:-replace_with_den_db_password}
      MYSQL_ROOT_PASSWORD: ${DEN_DB_ROOT_PASSWORD:-replace_with_den_root_password}
    volumes:
      - den-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ai-gateway-db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${AI_GATEWAY_DB_NAME:-veslo_ai_gateway}
      MYSQL_USER: ${AI_GATEWAY_DB_USER:-gateway}
      MYSQL_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:-replace_with_ai_gateway_db_password}
      MYSQL_ROOT_PASSWORD: ${AI_GATEWAY_DB_ROOT_PASSWORD:-replace_with_ai_gateway_root_password}
    volumes:
      - ai-gateway-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker-manager:
    <<: *node-app
    image: veslo-owned-server-worker-manager:local
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: worker-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CI: "true"
      NODE_ENV: production
      PORT: "8790"
      OWNED_WORKER_MANAGER_TOKEN: ${OWNED_WORKER_MANAGER_TOKEN:-replace_with_owned_worker_manager_token}
      OWNED_WORKER_PUBLIC_DOMAIN_SUFFIX: ${OWNED_WORKER_PUBLIC_DOMAIN_SUFFIX:-workers.veslo.work}
      WORKER_IMAGE: ${WORKER_IMAGE:-veslo-owned-server-worker-runtime:local}
      WORKER_DOCKER_NETWORK: ${VESLO_DOCKER_NETWORK:-veslo-owned-server-runtime}
      WORKER_PROVISION_TIMEOUT_MS: ${WORKER_PROVISION_TIMEOUT_MS:-180000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_HEALTHCHECK_TIMEOUT_MS: ${WORKER_HEALTHCHECK_TIMEOUT_MS:-2000}
      WORKER_RESOURCE_MEMORY_BYTES: ${WORKER_RESOURCE_MEMORY_BYTES:-1073741824}
      WORKER_RESOURCE_CPUS: ${WORKER_RESOURCE_CPUS:-1}
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:8790/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker-runtime-image:
    image: ${WORKER_IMAGE:-veslo-owned-server-worker-runtime:local}
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: worker-runtime
      args:
        BUN_VERSION: ${WORKER_BUN_VERSION:-1.3.6}
    profiles:
      - worker-image
    command: ["true"]

  backup:
    image: veslo-owned-server-backup:local
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: backup
    restart: unless-stopped
    init: true
    depends_on:
      den-db:
        condition: service_healthy
      ai-gateway-db:
        condition: service_healthy
    volumes:
      - ${BACKUP_HOST_ROOT:-/srv/veslo/backups}:/srv/veslo/backups
    environment:
      CI: "true"
      NODE_ENV: production
      BACKUP_ROOT: /srv/veslo/backups
      MYSQL_DUMP_MODE: direct
      DEN_DB_HOST: den-db
      DEN_DB_NAME: ${DEN_DB_NAME:-den}
      DEN_DB_ROOT_PASSWORD: ${DEN_DB_ROOT_PASSWORD:-replace_with_den_root_password}
      AI_GATEWAY_DB_HOST: ai-gateway-db
      AI_GATEWAY_DB_NAME: ${AI_GATEWAY_DB_NAME:-veslo_ai_gateway}
      AI_GATEWAY_DB_ROOT_PASSWORD: ${AI_GATEWAY_DB_ROOT_PASSWORD:-replace_with_ai_gateway_root_password}
      LETTR_API_KEY: ${LETTR_API_KEY:-}
      AUTH_EMAIL_ADDRESS: ${AUTH_EMAIL_ADDRESS:-}
      AUTH_EMAIL_FROM_NAME: ${AUTH_EMAIL_FROM_NAME:-Veslo}
      BACKUP_ALERT_EMAIL_RECIPIENTS: ${BACKUP_ALERT_EMAIL_RECIPIENTS:-}
      AI_GATEWAY_ALERT_EMAIL_RECIPIENTS: ${AI_GATEWAY_ALERT_EMAIL_RECIPIENTS:-}
      BACKUP_DAILY_UTC_TIME: ${BACKUP_DAILY_UTC_TIME:-02:15:00}
      BACKUP_RANDOM_DELAY_SECONDS: ${BACKUP_RANDOM_DELAY_SECONDS:-900}

  den:
    <<: *node-app
    image: veslo-owned-server-den:local
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: den
    depends_on:
      den-db:
        condition: service_healthy
      worker-manager:
        condition: service_healthy
    volumes:
      - den-codex-data:/var/lib/veslo-den/codex
    environment:
      CI: "true"
      NODE_ENV: production
      VESLO_DEPLOYMENT_DOMAIN: ${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}
      PORT: "8788"
      DATABASE_URL: ${DATABASE_URL:-mysql://den:replace_with_den_db_password@den-db:3306/den}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace_with_32_char_den_auth_secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      WORKER_TOKEN_ENCRYPTION_KEY: ${WORKER_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LETTR_API_KEY: ${LETTR_API_KEY:-}
      AUTH_EMAIL_ADDRESS: ${AUTH_EMAIL_ADDRESS:-}
      AUTH_EMAIL_FROM_NAME: ${AUTH_EMAIL_FROM_NAME:-Veslo}
      DEN_AI_GATEWAY_INTERNAL_TOKEN: ${DEN_AI_GATEWAY_INTERNAL_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED: ${DESKTOP_AUTH_REQUIRE_EMAIL_VERIFIED:-true}
      PROVISIONER_MODE: ${PROVISIONER_MODE:-render}
      WORKER_URL_TEMPLATE: ${WORKER_URL_TEMPLATE:-}
      OWNED_WORKER_MANAGER_URL: ${OWNED_WORKER_MANAGER_URL:-http://worker-manager:8790}
      OWNED_WORKER_MANAGER_TOKEN: ${OWNED_WORKER_MANAGER_TOKEN:-replace_with_owned_worker_manager_token}
      OWNED_WORKER_PUBLIC_DOMAIN_SUFFIX: ${OWNED_WORKER_PUBLIC_DOMAIN_SUFFIX:-}
      RENDER_API_BASE: ${RENDER_API_BASE:-https://api.render.com/v1}
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      RENDER_OWNER_ID: ${RENDER_OWNER_ID:-}
      RENDER_WORKER_REPO: ${RENDER_WORKER_REPO:-https://github.com/neatechcz/veslo}
      RENDER_WORKER_BRANCH: ${RENDER_WORKER_BRANCH:-dev}
      RENDER_WORKER_ROOT_DIR: ${RENDER_WORKER_ROOT_DIR:-services/den-worker-runtime}
      RENDER_WORKER_PLAN: ${RENDER_WORKER_PLAN:-standard}
      RENDER_WORKER_REGION: ${RENDER_WORKER_REGION:-oregon}
      RENDER_WORKER_VESLO_VERSION: ${RENDER_WORKER_VESLO_VERSION:-0.11.113}
      RENDER_WORKER_NAME_PREFIX: ${RENDER_WORKER_NAME_PREFIX:-den-worker-veslo}
      RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX: ${RENDER_WORKER_PUBLIC_DOMAIN_SUFFIX:-}
      RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS: ${RENDER_CUSTOM_DOMAIN_READY_TIMEOUT_MS:-240000}
      RENDER_PROVISION_TIMEOUT_MS: ${RENDER_PROVISION_TIMEOUT_MS:-900000}
      RENDER_HEALTHCHECK_TIMEOUT_MS: ${RENDER_HEALTHCHECK_TIMEOUT_MS:-180000}
      RENDER_POLL_INTERVAL_MS: ${RENDER_POLL_INTERVAL_MS:-5000}
      VERCEL_API_BASE: ${VERCEL_API_BASE:-https://api.vercel.com}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_TEAM_SLUG: ${VERCEL_TEAM_SLUG:-}
      VERCEL_DNS_DOMAIN: ${VERCEL_DNS_DOMAIN:-}
      POLAR_FEATURE_GATE_ENABLED: ${POLAR_FEATURE_GATE_ENABLED:-false}
      POLAR_API_BASE: ${POLAR_API_BASE:-https://api.polar.sh}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PRODUCT_ID: ${POLAR_PRODUCT_ID:-}
      POLAR_BENEFIT_ID: ${POLAR_BENEFIT_ID:-}
      POLAR_SUCCESS_URL: ${POLAR_SUCCESS_URL:-}
      POLAR_RETURN_URL: ${POLAR_RETURN_URL:-}
      YOUTRACK_PROJECT_KEY: ${YOUTRACK_PROJECT_KEY:-VSLO}
      YOUTRACK_URL: ${YOUTRACK_URL:-}
      YOUTRACK_TOKEN: ${YOUTRACK_TOKEN:-}
      YOUTRACK_TIMEOUT_MS: ${YOUTRACK_TIMEOUT_MS:-20000}
      DEN_LOG_INGEST_TOKEN: ${DEN_LOG_INGEST_TOKEN:-}
      DEN_LOG_MASTER_KEY: ${DEN_LOG_MASTER_KEY:-}
      DEN_LOG_MASTER_KEY_VERSION: ${DEN_LOG_MASTER_KEY_VERSION:-}
      DEN_LOG_RETENTION_DAYS: ${DEN_LOG_RETENTION_DAYS:-30}
      GOOGLE_WORKSPACE_OAUTH_CLIENT_ID: ${GOOGLE_WORKSPACE_OAUTH_CLIENT_ID:-}
      GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET: ${GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_OAUTH_REDIRECT_URI: ${GOOGLE_WORKSPACE_OAUTH_REDIRECT_URI:-}
      GOOGLE_WORKSPACE_OAUTH_STATE_SECRET: ${GOOGLE_WORKSPACE_OAUTH_STATE_SECRET:-}
      GOOGLE_WORKSPACE_OAUTH_SUCCESS_REDIRECT_URL: ${GOOGLE_WORKSPACE_OAUTH_SUCCESS_REDIRECT_URL:-}
      GOOGLE_WORKSPACE_TOKEN_SECRET_KEY: ${GOOGLE_WORKSPACE_TOKEN_SECRET_KEY:-}
      GOOGLE_WORKSPACE_CONNECTOR_BASE_URL: ${GOOGLE_WORKSPACE_CONNECTOR_BASE_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_TOKEN_SECRET_KEY: ${MICROSOFT_TOKEN_SECRET_KEY:-}
      MICROSOFT_CONNECTOR_BASE_URL: ${MICROSOFT_CONNECTOR_BASE_URL:-}
      MANAGED_AI_DATABASE_URL: ${MANAGED_AI_DATABASE_URL:-}
      MANAGED_AI_SECRET_KEY: ${MANAGED_AI_SECRET_KEY:-}
      MANAGED_AI_OPENAI_CLIENT_ID: ${MANAGED_AI_OPENAI_CLIENT_ID:-}
      MANAGED_AI_OPENAI_CLIENT_SECRET: ${MANAGED_AI_OPENAI_CLIENT_SECRET:-}
      MANAGED_AI_OPENAI_REDIRECT_BASE: ${MANAGED_AI_OPENAI_REDIRECT_BASE:-}
      MANAGED_AI_CODEX_COMMAND: ${MANAGED_AI_CODEX_COMMAND:-codex}
      MANAGED_AI_CODEX_HOME: ${MANAGED_AI_CODEX_HOME:-/var/lib/veslo-den/codex}
      MANAGED_AI_CODEX_ALLOW_HOST_HOME: ${MANAGED_AI_CODEX_ALLOW_HOST_HOME:-}
      MANAGED_AI_CODEX_WORKDIR: ${MANAGED_AI_CODEX_WORKDIR:-/tmp}
      MANAGED_AI_CODEX_TIMEOUT_MS: ${MANAGED_AI_CODEX_TIMEOUT_MS:-180000}
      MANAGED_AI_CODEX_STATUS_TTL_MS: ${MANAGED_AI_CODEX_STATUS_TTL_MS:-300000}
      MANAGED_AI_CODEX_AUTH_JSON: ${MANAGED_AI_CODEX_AUTH_JSON:-}
      MANAGED_AI_CODEX_OAUTH_INFERENCE_BASE_URL: ${MANAGED_AI_CODEX_OAUTH_INFERENCE_BASE_URL:-}
      MANAGED_AI_CODEX_OAUTH_BASE_URL: ${MANAGED_AI_CODEX_OAUTH_BASE_URL:-}
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:8788/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ai-gateway:
    <<: *node-app
    image: veslo-owned-server-ai-gateway:local
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: ai-gateway
    depends_on:
      ai-gateway-db:
        condition: service_healthy
      den:
        condition: service_healthy
    volumes:
      - ai-gateway-codex-data:/var/lib/veslo-ai-gateway/codex
    environment:
      CI: "true"
      NODE_ENV: production
      VESLO_DEPLOYMENT_DOMAIN: ${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}
      AI_GATEWAY_HOST: 0.0.0.0
      AI_GATEWAY_PORT: "4034"
      AI_GATEWAY_DATABASE_URL: ${AI_GATEWAY_DATABASE_URL:-mysql://gateway:replace_with_ai_gateway_db_password@ai-gateway-db:3306/veslo_ai_gateway}
      AI_GATEWAY_SECRET_KEY: ${AI_GATEWAY_SECRET_KEY:-replace_with_32_char_ai_gateway_secret}
      AI_GATEWAY_OPENAI_CLIENT_ID: ${AI_GATEWAY_OPENAI_CLIENT_ID:-replace_with_openai_client_id}
      AI_GATEWAY_OPENAI_CLIENT_SECRET: ${AI_GATEWAY_OPENAI_CLIENT_SECRET:-replace_with_openai_client_secret}
      AI_GATEWAY_OPENAI_REDIRECT_BASE: ${AI_GATEWAY_OPENAI_REDIRECT_BASE:-}
      AI_GATEWAY_DEN_API_BASE: ${AI_GATEWAY_DEN_API_BASE:-}
      AI_GATEWAY_DEN_INTERNAL_TOKEN: ${AI_GATEWAY_DEN_INTERNAL_TOKEN:-}
      LETTR_API_KEY: ${LETTR_API_KEY:-}
      AUTH_EMAIL_ADDRESS: ${AUTH_EMAIL_ADDRESS:-}
      AUTH_EMAIL_FROM_NAME: ${AUTH_EMAIL_FROM_NAME:-Veslo}
      AI_GATEWAY_ALERT_EMAIL_RECIPIENTS: ${AI_GATEWAY_ALERT_EMAIL_RECIPIENTS:-}
      AI_GATEWAY_CODEX_CAPACITY_ALERT_EMAIL_INTERVAL_MS: ${AI_GATEWAY_CODEX_CAPACITY_ALERT_EMAIL_INTERVAL_MS:-300000}
      AI_GATEWAY_CREDENTIAL_ALERT_EMAIL_INTERVAL_MS: ${AI_GATEWAY_CREDENTIAL_ALERT_EMAIL_INTERVAL_MS:-60000}
      AI_GATEWAY_CODEX_COMMAND: ${AI_GATEWAY_CODEX_COMMAND:-codex}
      AI_GATEWAY_CODEX_HOME: ${AI_GATEWAY_CODEX_HOME:-/var/lib/veslo-ai-gateway/codex}
      AI_GATEWAY_CODEX_ALLOW_HOST_HOME: ${AI_GATEWAY_CODEX_ALLOW_HOST_HOME:-}
      AI_GATEWAY_CODEX_WORKDIR: ${AI_GATEWAY_CODEX_WORKDIR:-/tmp}
      AI_GATEWAY_CODEX_TIMEOUT_MS: ${AI_GATEWAY_CODEX_TIMEOUT_MS:-180000}
      AI_GATEWAY_CODEX_STATUS_TTL_MS: ${AI_GATEWAY_CODEX_STATUS_TTL_MS:-300000}
      AI_GATEWAY_CODEX_AUTH_JSON: ${AI_GATEWAY_CODEX_AUTH_JSON:-}
      AI_GATEWAY_CODEX_OAUTH_INFERENCE_BASE_URL: ${AI_GATEWAY_CODEX_OAUTH_INFERENCE_BASE_URL:-}
      AI_GATEWAY_CODEX_OAUTH_BASE_URL: ${AI_GATEWAY_CODEX_OAUTH_BASE_URL:-}
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:4034/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    <<: *node-app
    image: veslo-owned-server-web:local
    build:
      context: ../..
      dockerfile: packaging/owned-server/Dockerfile
      target: web
      args:
        VESLO_DEPLOYMENT_DOMAIN: ${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}
        DEN_API_BASE: ${DEN_API_BASE:-}
        DEN_AUTH_ORIGIN: ${DEN_AUTH_ORIGIN:-}
        NEXT_PUBLIC_OPENWORK_APP_CONNECT_URL: ${NEXT_PUBLIC_OPENWORK_APP_CONNECT_URL:-}
        NEXT_PUBLIC_OPENWORK_AUTH_CALLBACK_URL: ${NEXT_PUBLIC_OPENWORK_AUTH_CALLBACK_URL:-}
        NEXT_PUBLIC_VESLO_APP_CONNECT_URL: ${NEXT_PUBLIC_VESLO_APP_CONNECT_URL:-}
        NEXT_PUBLIC_VESLO_AUTH_CALLBACK_URL: ${NEXT_PUBLIC_VESLO_AUTH_CALLBACK_URL:-}
        NEXT_PUBLIC_VESLO_DEPLOYMENT_DOMAIN: ${NEXT_PUBLIC_VESLO_DEPLOYMENT_DOMAIN:-${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_API_KEY: ${NEXT_PUBLIC_POSTHOG_API_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      den:
        condition: service_healthy
    environment:
      CI: "true"
      NODE_ENV: production
      VESLO_DEPLOYMENT_DOMAIN: ${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}
      PORT: "3005"
      DEN_API_BASE: ${DEN_API_BASE:-}
      DEN_AUTH_ORIGIN: ${DEN_AUTH_ORIGIN:-}
      NEXT_PUBLIC_OPENWORK_APP_CONNECT_URL: ${NEXT_PUBLIC_OPENWORK_APP_CONNECT_URL:-}
      NEXT_PUBLIC_OPENWORK_AUTH_CALLBACK_URL: ${NEXT_PUBLIC_OPENWORK_AUTH_CALLBACK_URL:-}
      NEXT_PUBLIC_VESLO_APP_CONNECT_URL: ${NEXT_PUBLIC_VESLO_APP_CONNECT_URL:-}
      NEXT_PUBLIC_VESLO_AUTH_CALLBACK_URL: ${NEXT_PUBLIC_VESLO_AUTH_CALLBACK_URL:-}
      NEXT_PUBLIC_VESLO_DEPLOYMENT_DOMAIN: ${NEXT_PUBLIC_VESLO_DEPLOYMENT_DOMAIN:-${VESLO_DEPLOYMENT_DOMAIN:-veslo.work}}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_API_KEY: ${NEXT_PUBLIC_POSTHOG_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      LOOPS_API_KEY: ${LOOPS_API_KEY:-}
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3005/'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      den:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
      worker-manager:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@veslo.work}
    volumes:
      - ${VESLO_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  den-db-data:
  ai-gateway-db-data:
  den-codex-data:
  ai-gateway-codex-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: ${VESLO_DOCKER_NETWORK:-veslo-owned-server-runtime}
